function shuffle(items) {
  const result = [...items];
  for (let index = result.length - 1; index > 0; index--) {
    const other = Math.floor(Math.random() * (index + 1));
    [result[index], result[other]] = [result[other], result[index]];
  }
  return result;
}
const typeNames = ["Nhớ nghĩa", "Điền cụm từ", "Sửa lỗi", "Dịch Việt–Anh", "Chọn tình huống"];

function prioritizeUnanswered(items) {
  const mixed = shuffle(items);
  return mixed.filter(item => !(item.key in progress.results))
    .concat(mixed.filter(item => item.key in progress.results));
}

function makeQuestion(exercise) {
  const {phrase, index} = exercise;
  const other = phrasesByTopic[phrase.topic].filter(item => item.id !== phrase.id);
  if (index === 0) {
    return { title:phrase.term, instruction:"Chọn nghĩa của cụm từ.", answer:phrase.meaning, choices:[phrase.meaning, ...shuffle(other).slice(0,3).map(item => item.meaning)] };
  }
  if (index === 1) {
    const start = phrase.example.toLowerCase().indexOf(phrase.pattern.toLowerCase());
    const end = start + phrase.pattern.length;
    return { title:phrase.example.slice(0,start) + "_____" + phrase.example.slice(end), instruction:"Điền cụm tiếng Anh còn thiếu.", answer:phrase.example.slice(start,end), alternative:phrase.alternative, hint:phrase.translation };
  }
  if (index === 2) {
    return {
      title:phrase.error, instruction:"Viết lại cả câu và sửa lỗi trong cụm từ.", answer:phrase.corrected,
      alternative:phrase.alternative && phrase.corrected.toLowerCase().replace(phrase.pattern.toLowerCase(), phrase.alternative),
    };
  }
  if (index === 3) {
    return { title:phrase.translation, instruction:"Chọn câu tiếng Anh truyền đạt đúng ý.", answer:phrase.example, choices:[phrase.example, ...shuffle(other).slice(0,3).map(item => item.example)] };
  }
  const interchangeable = ["that's fine", "no worries"];
  const distractors = interchangeable.includes(phrase.term)
    ? other.filter(item => !interchangeable.includes(item.term))
    : other;
  return { title:phrase.prompt, instruction:"Chọn cụm phù hợp nhất cho tình huống.", answer:phrase.term, choices:[phrase.term, ...shuffle(distractors).slice(0,3).map(item => item.term)] };
}

      <form class="panel quiz" id="practice-form"><div class="filters">

        <label><span class="sr">Dạng bài</span><select id="practice-type"><option value="all">Trộn 5 dạng bài</option>${typeNames.map((name,index) => `<option value="${index}">${name}</option>`).join("")}</select></label>
        <label><span class="sr">Số câu</span><select id="practice-count"><option value="10">10 câu</option><option value="20">20 câu</option><option value="all">Toàn bộ</option></select></label></div>
      <button class="btn" type="submit">Bắt đầu làm bài</button></form>`;
    el("practice-type").value = practiceSettings.type;
    el("practice-count").value = practiceSettings.count;
    return;
  }
  if (run.position === run.items.length) {
    const missed = run.answers.filter(answer => !answer.correct).map(answer => answer.exercise);
    main.innerHTML = `${heading}<section class="panel quiz">
      <h2>Đúng ${run.items.length - missed.length}/${run.items.length} câu</h2>
      ${missed.length ? `<ul class="error-list">${missed.map(({phrase,type}) => `<li><strong lang="en">${phrase.term}</strong> · ${type}<p class="muted">${phrase.note}</p></li>`).join("")}</ul>` : "<p>Hoàn thành lượt này. M có thể ôn lại các cụm trong mục Ôn tập.</p>"}
      <div class="actions">${missed.length ? '<button class="btn" data-act="retry">Làm lại câu sai</button>' : ''}<button class="btn alt" data-act="restart">Chọn bài mới</button></div>
    </section>`;
    return;
  }
  const exercise = run.items[run.position];
  const question = run.question;
  const result = run.answers[run.position];
  main.innerHTML = `${heading}
    <section class="panel quiz"><div class="row spread"><span class="pill">${exercise.type}</span><span class="muted">Câu ${run.position + 1}/${run.items.length}</span></div>
    <div class="progress" role="progressbar" aria-label="Tiến độ bài tập" aria-valuenow="${run.position}" aria-valuemin="0" aria-valuemax="${run.items.length}"><span style="width:${run.position / run.items.length * 100}%"></span></div>
    <p>${question.instruction}</p><h2 id="question-title" tabindex="-1" lang="${exercise.index === 3 ? "vi" : "en"}">${question.title}</h2>
    ${question.hint ? `<p class="muted">${question.hint}</p>` : ""}
    <form id="question-form">
    ${question.choices ? `<div class="options">${question.choices.map((choice,index) => {
      const selected = run.selection === index;
      const color = result && (choice === question.answer ? "good" : selected ? "bad" : "");
      return `<button type="button" class="option ${color || ""}" data-act="choose" data-id="${index}" aria-pressed="${selected}" ${result ? "disabled" : ""}>${choice}</button>`;
    }).join("")}</div>` : `<label><span class="sr">Câu trả lời</span><input class="typed" id="typed" placeholder="Gõ câu trả lời bằng tiếng Anh" autocapitalize="off" autocomplete="off" spellcheck="false" value="${escapeHtml(result?.response || "")}" ${result ? "readonly" : "required"}></label>`}
    <div id="quiz-feedback" class="feedback${result && !result.correct ? " bad" : ""}" role="status" tabindex="-1" ${result ? "" : "hidden"}>
      ${result ? `<div class="answer-title">${result.correct ? "Đúng rồi!" : "Đáp án mẫu"}</div><p lang="en">${question.answer}</p><p>${exercise.phrase.note}</p>` : ""}
    </div>
    <div class="actions spread">
      ${result ? `<button type="button" class="btn" data-act="next">${run.position + 1 === run.items.length ? "Xem kết quả" : "Câu tiếp theo"}</button>` : `<button type="submit" class="btn" id="check-answer" ${question.choices && run.selection === null ? "disabled" : ""}>Kiểm tra</button>`}
      <button type="button" class="btn alt small" data-act="restart">Chọn bài khác</button>
    </div></form></section>`;
}
function prepareQuestion() {
  const item = run.items[run.position];
  if (item) {
    run.question = makeQuestion(item);
    if (run.question.choices) run.question.choices = shuffle(run.question.choices);
  }
  run.selection = null;
}
function start(items) {
  if (!items.length) return;
  run = {items, position:0, answers:[]};
  prepareQuestion();
  navigate("practice");
}
function submitAnswer() {
  if (!run || run.answers[run.position]) return;
  const exercise = run.items[run.position];
  const response = run.question.choices ? run.question.choices[run.selection] : el("typed").value.trim();
  if (!response) return;
  const normalized = normalize(response);
  const correct = [run.question.answer, run.question.alternative]
    .some(answer => answer && normalized === normalize(answer));
  run.answers.push({exercise, correct, response});
  progress.results[exercise.key] = correct;
  if (correct) delete progress.errors[exercise.key];
  else {
    progress.errors[exercise.key] = true;
    const card = progress.cards[exercise.phrase.id];
    if (card) card.due = Date.now();
  }
  queuePhrase(exercise.phrase.id);
  save();
  renderPractice();
  el("quiz-feedback").focus();
}
function renderReview() {
  const heading = title("Ôn tập", "Nhìn nghĩa và tự nói cụm tiếng Anh trước khi lật thẻ. Mốc ôn là 1, 3, 7, 14 và 30 ngày.");
  const due = dueCards();
  const errors = exercises.filter(exercise => progress.errors[exercise.key]);
  if (reviewRun) {
    const remaining = reviewRun.items.slice(reviewRun.position + 1);
    const phrase = reviewRun.items[reviewRun.position];
    main.innerHTML = `${heading}<section class="panel quiz"><div class="row spread"><span class="pill">Thẻ ghi nhớ</span><span class="muted">Còn ${remaining.length + 1} thẻ</span></div>
      <h2>${phrase.meaning}</h2><p>${phrase.translation}</p>
      ${reviewRun.revealed ? `<div class="card-answer"><h3 lang="en">${phrase.term}</h3><p lang="en">${phrase.example}</p></div>
        <div class="actions"><button class="btn" data-act="review-grade" data-id="1">Nhớ được</button><button class="btn alt" data-act="review-grade" data-id="0">Chưa nhớ</button><button class="btn alt small" data-act="audio" data-id="${phrase.id}">${icon("speaker")} Nghe mẫu</button></div>`
        : '<div class="actions section"><button class="btn" data-act="reveal">Lật thẻ</button></div>'}</section>`;
    return;
  }
  const future = phrases.filter(phrase => progress.cards[phrase.id]?.due > Date.now())
    .sort((first,second) => progress.cards[first.id].due - progress.cards[second.id].due);
  main.innerHTML = `${heading}<div class="section stats">
    ${stat("repeat", due.length, "Thẻ đến hạn")}${stat("check", errors.length, "Câu cần sửa", "peach")}${stat("book", future.length, "Thẻ đã lên lịch", "mint")}</div>
    <div class="section actions"><button class="btn" data-act="review-start" ${due.length ? "" : "disabled"}>Ôn thẻ đến hạn</button><button class="btn alt" data-act="error-start" ${errors.length ? "" : "disabled"}>Làm lại câu sai</button><button class="btn alt" data-page="words">Xem từ vựng</button></div>
    ${future.length ? `<section class="panel section"><h2>Lịch ôn sắp tới</h2><ul class="error-list">${future.map(phrase => `<li class="row spread"><strong lang="en">${phrase.term}</strong><span class="muted">${dateLabel(progress.cards[phrase.id].due)}</span></li>`).join("")}</ul></section>`
      : due.length || errors.length ? "" : '<p class="muted section">Làm một bài hoặc thêm cụm từ để bắt đầu lịch ôn.</p>'}`;
}
function stopTimer() {
  clearInterval(timer);
  timer = null;
}
function releaseMic() {
  recordingRequest++;
  if (recording && recording.state !== "inactive") {
    recording.ondataavailable = null;
    recording.onstop = null;
    recording.stop();
  }
  recording = null;
  stream?.getTracks().forEach(track => track.stop());
  stream = null;
  if (recordingUrl) URL.revokeObjectURL(recordingUrl);
  recordingUrl = null;
}
function resetSpeaking() {
  stopTimer();
  releaseMic();
  seconds = 60;
}
function showTimer() {
  el("timer").textContent = `${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,"0")}`;
}
function renderSpeaking() {
  const choices = phrasesByTopic[speakingTopic];
  const phrase = choices[speakingIndex];
  main.innerHTML = `${title("Luyện nói 60 giây", "Nói thành tiếng, nghe lại bản thu và tự kiểm tra bằng ba tiêu chí bên dưới.")}
    <section class="panel quiz spoken">
    <div class="row spread"><label><span class="sr">Chủ đề luyện nói</span><select class="typed" id="speaking-topic">${topicOptions(String(speakingTopic), false)}</select></label><span class="pill">Đề ${speakingIndex + 1}/${choices.length}</span></div>
    <h2 lang="en">${phrase.prompt}</h2><p class="muted">Cụm gợi ý <strong lang="en">${phrase.term}</strong></p>
    <div id="timer" class="timer">1:00</div>
    <div class="actions"><button class="btn" id="timer-button" data-act="timer">Bấm giờ</button><button class="btn alt" id="record-button" data-act="record">${icon("mic")} Thu âm</button><button class="btn alt" data-act="speaking-next">Đề tiếp theo</button></div>
    <p class="muted" id="mic-status" role="status"></p><audio class="record-audio" id="record-audio" controls hidden></audio>
    <details><summary>Ví dụ dùng cụm từ</summary><p lang="en">${phrase.example}</p></details>
    <h3>Tự kiểm tra</h3>
    <div class="rubric"><label><input type="checkbox">Mình trả lời trực tiếp và có một lý do.</label><label><input type="checkbox">Mình có ví dụ hoặc chi tiết cụ thể.</label><label><input type="checkbox">Mình dùng cụm gợi ý đúng ngữ cảnh.</label></div>
    <button class="btn small alt" data-act="speaking-save">Lưu lượt luyện</button>
    </section>`;
}
async function record() {
  const status = el("mic-status");
  const button = el("record-button");
  const audio = el("record-audio");
  if (recording?.state === "recording") {
    recording.stop();
    return;
  }
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
    status.textContent = "Trình duyệt này chưa hỗ trợ thu âm. M vẫn có thể dùng đồng hồ và tự kiểm tra.";
    return;
  }
  releaseMic();
  const request = recordingRequest;
  button.disabled = true;
  audio.hidden = true;
  audio.removeAttribute("src");
  try {
    const input = await navigator.mediaDevices.getUserMedia({audio:true});
    if (request !== recordingRequest) {
      input.getTracks().forEach(track => track.stop());
      return;
    }
    stream = input;
    const clip = new MediaRecorder(input);
    let chunks = [];
    recording = clip;
    clip.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
    clip.onstop = () => {
      input.getTracks().forEach(track => track.stop());
      stream = null;
      recording = null;
      if (request !== recordingRequest) return;
      if (chunks.length) {
        recordingUrl = URL.createObjectURL(new Blob(chunks, {type:clip.mimeType || chunks[0].type}));
        audio.src = recordingUrl;
        audio.hidden = false;
      }
      chunks = [];
      button.innerHTML = `${icon("mic")} Thu lại`;
      status.textContent = "Có thể nghe lại bản thu bên dưới.";
    };
    clip.start();
    status.textContent = "Đang thu âm…";
    button.textContent = "Dừng thu âm";
  } catch {
    if (request === recordingRequest) {
      releaseMic();
      status.textContent = "Chưa mở được micro. Hãy kiểm tra quyền micro của trình duyệt.";
    }
  } finally {
    button.disabled = false;
  }
}
function render() {
  nav.innerHTML = Object.entries(pages).map(([key,label]) =>
    `<button data-page="${key}"${key === currentPage ? ' aria-current="page"' : ""}>${label}</button>`).join("");
  ({home:renderHome, words:renderWords, practice:renderPractice, review:renderReview, speaking:renderSpeaking})[currentPage]();
}
function navigate(page) {
  if (currentPage === "speaking") resetSpeaking();
  currentPage = page;
  render();
  main.focus({preventScroll:true});
  window.scrollTo(0,0);
}
document.addEventListener("click", event => {
  const target = event.target.closest("button[data-page], button[data-act]");
  if (!target || target.disabled) return;
  if (target.dataset.page) { navigate(target.dataset.page); return; }
  const id = Number(target.dataset.id);
  switch (target.dataset.act) {
    case "quick": start(prioritizeUnanswered(exercises).slice(0,10)); break;
    case "topic": startWith(id); break;
    case "queue": queuePhrase(id); target.textContent = "Đã lưu để ôn"; target.disabled = true; break;
    case "audio": {
      if (!("speechSynthesis" in window)) {
        target.textContent = "Không có giọng đọc";
        break;
      }
      window.speechSynthesis.cancel();
      const message = new SpeechSynthesisUtterance(phrasesById.get(id).example);
      message.lang = "en-US";
      message.rate = .87;
      window.speechSynthesis.speak(message);
      break;
    }
    case "choose":
      run.selection = id;
      main.querySelectorAll('[data-act="choose"]').forEach(button => button.setAttribute("aria-pressed", String(button === target)));
      el("check-answer").disabled = false;
      break;
    case "next":
      run.position++;
      prepareQuestion();
      renderPractice();
      (el("question-title") || main).focus();
      break;
    case "restart": run = null; renderPractice(); break;
    case "retry": start(shuffle(run.answers.filter(item => !item.correct).map(item => item.exercise))); break;
    case "error-start": start(shuffle(exercises.filter(item => progress.errors[item.key]))); break;
    case "review-start": reviewRun = {items:dueCards(), position:0, revealed:false}; renderReview(); break;
    case "reveal": reviewRun.revealed = true; renderReview(); break;
    case "review-grade":
      gradeReview(reviewRun.items[reviewRun.position].id, id === 1);
      reviewRun.position++;
      reviewRun.revealed = false;
      if (reviewRun.position >= reviewRun.items.length) reviewRun = null;
      renderReview();
      break;
    case "speaking-next":
      resetSpeaking();
      speakingIndex = (speakingIndex + 1) % phrasesByTopic[speakingTopic].length;
      renderSpeaking();
      break;
    case "speaking-save":
      progress.speaking++;
      save();
      target.disabled = true;
      target.textContent = "Đã lưu lượt luyện";
      break;
    case "timer": {
      const button = el("timer-button");
      if (timer) {
        stopTimer();
        button.textContent = "Tiếp tục";
        break;
      }
      if (!seconds) seconds = 60;
      showTimer();
      button.textContent = "Tạm dừng";
      const ends = Date.now() + seconds * 1000;
      timer = setInterval(() => {
        seconds = Math.max(0, Math.ceil((ends - Date.now())/1000));
        showTimer();
        if (!seconds) {
          stopTimer();
          button.textContent = "Bấm giờ lại";
        }
      }, 250);
      break;
    }
    case "record": void record(); break;
  }
});
document.addEventListener("input", event => {
  if (event.target.id === "word-search") {
    study.search = event.target.value;
    renderWordCards();
  }
});
document.addEventListener("change", event => {
  const {id,value} = event.target;
  if (id === "word-topic" || id === "word-level") {
    if (id === "word-topic") study.topic = value;
    else study.level = value;
    renderWordCards();
  }
  if (id === "speaking-topic") {
    resetSpeaking();
    speakingTopic = Number(value);
    speakingIndex = 0;
    renderSpeaking();
  }
});
document.addEventListener("submit", event => {
  if (event.target.id === "question-form") {
    event.preventDefault();
    submitAnswer();
  }
  if (event.target.id === "practice-form") {
    event.preventDefault();
    practiceSettings.topic = el("practice-topic").value;
    practiceSettings.type = el("practice-type").value;
    practiceSettings.count = el("practice-count").value;
    const items = exercises.filter(item =>
      (practiceSettings.topic === "all" || Number(practiceSettings.topic) === item.phrase.topic)
      && (practiceSettings.type === "all" || Number(practiceSettings.type) === item.index));
    const mixed = prioritizeUnanswered(items);
    start(practiceSettings.count === "all" ? mixed : mixed.slice(0,Number(practiceSettings.count)));
  }
});
document.querySelector(".brand-mark").innerHTML = icon("wave");
render();
</script>
</body>
