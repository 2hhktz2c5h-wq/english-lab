Tan học tôi phát hiện mất điện thoại. Tôi mượn máy bạn gọi số mình nhưng không ai nghe. Quay lại lớp mới thấy máy dưới bàn. Hóa ra nó rơi xuống đất. Tìm được rồi tôi nhắn ngay cho bạn để bạn khỏi tìm tiếp.", "exampleLabel": "Ngữ cảnh trong bài đọc"}, {"id": "life2-13-706", "han": "通知", "vi": "thông báo", "pinyin": "tōng zhī", "topic": "Điện thoại & Internet", "lesson": 13, "source": "extension", "level": "B1", "usage": 88}, {"id": "life2-13-707", "han": "密碼", "vi": "mật khẩu", "pinyin": "mì mǎ", "topic": "Điện thoại & Internet", "lesson": 13, "source": "extension", "level": "B1", "usage": 88}, {"id": "life2-13-708", "han": "登入", "vi": "đăng nhập", "pinyin": "dēng rù", "topic": "Điện thoại & Internet", "lesson": 13, "source": "extension", "level": "B1", "usage": 88}, {"id": "life2-13-709", "han": "登出", "vi": "đăng xuất", "pinyin": "dēng chū", "topic": "Điện thoại & Internet", "lesson": 13, "source": "extension", "level": "B1", "usage": 88}, {"id": "life2-13-710", "han": "備份", "vi": "sao lưu", "pinyin": "bèi fèn", "topic": "Điện thoại & Internet", "lesson": 13, "source": "extension", "level": "B1", "usage": 88}, {"id": "life2-14-711", "han": "目標", "vi": "mục tiêu", "pinyin": "mù biāo", "topic": "Tương lai & nghề nghiệp", "lesson": 14, "source": "extension", "level": "B1", "usage": 88, "example": "我明年就要畢業了。本來想馬上找工作，可是老師認為，我可以先想清楚自己的目標。我對翻譯有興趣，也希望繼續學中文。所以我打算先找一份相關的工作，再考慮要不要念研究所。", "examplePinyin": "wǒ míng nián jiù yào bì yè le。 běn lái xiǎng mǎ shàng zhǎo gōng zuò， kě shì lǎo shī rèn wéi， wǒ kě yǐ xiān xiǎng qīng chǔ zì jǐ de mù biāo。 wǒ duì fān yì yǒu xìng qù， yě xī wàng jì xù xué zhōng wén。 suǒ yǐ wǒ dǎ suàn xiān zhǎo yī fèn xiāng guān de gōng zuò， zài kǎo lǜ yào bù yào niàn yán jiū suǒ。", "exampleVi": "Năm sau tôi sắp tốt nghiệp. Ban đầu định tìm việc ngay nhưng thầy khuyên xác định mục tiêu trước. Tôi thích phiên dịch và muốn học tiếng Trung tiếp. Vì vậy tôi định tìm việc liên quan rồi cân nhắc học cao học.", "exampleLabel": "Ngữ cảnh trong bài đọc"}, {"id": "life2-14-712", "han": "計畫", "vi": "kế hoạch", "pinyin": "jì huà", "topic": "Tương lai & nghề nghiệp", "lesson": 14, "source": "extension", "level": "B1", "usage": 88}, {"id": "life2-14-713", "han": "求職", "vi": "tìm việc", "pinyin": "qiú zhí", "topic": "Tương lai & nghề nghiệp", "lesson": 14, "source": "extension", "level": "B1", "usage": 88}, {"id": "life2-14-714", "han": "職缺", "vi": "vị trí tuyển dụng", "pinyin": "zhí quē", "topic": "Tương lai & nghề nghiệp", "lesson": 14, "source": "extension", "level": "B1", "usage": 88}, {"id": "life2-14-715", "han": "進修", "vi": "học nâng cao", "pinyin": "jìn xiū", "topic": "Tương lai & nghề nghiệp", "lesson": 14, "source": "extension", "level": "B1", "usage": 88}, {"id": "life2-14-716", "han": "實習", "vi": "thực tập", "pinyin": "shí xí", "topic": "Tương lai & nghề nghiệp", "lesson": 14, "source": "extension", "level": "B1", "usage": 88}, {"id": "life2-15-717", "han": "新年快樂", "vi": "chúc mừng năm mới", "pinyin": "xīn nián kuài lè", "topic": "Tết & lễ hội", "lesson": 15, "source": "extension", "level": "B1", "usage": 88, "example": "今年我第一次在朋友家過年。除夕下午，全家一起打掃，門口貼上了春聯。晚上大家圍爐吃年夜飯。朋友的爸爸告訴我，吃魚有年年有餘的意思。飯後我們聊天，等到十二點再互相說新年快樂。", "examplePinyin": "jīn nián wǒ dì yī cì zài péng yǒu jiā guò nián。 chú xī xià wǔ， quán jiā yì qǐ dǎ sǎo， mén kǒu tiē shàng le chūn lián。 wǎn shàng dà jiā wéi lú chī nián yè fàn。 péng yǒu de bà bà gào sù wǒ， chī yú yǒu nián nián yǒu yú de yì si。 fàn hòu wǒ men liáo tiān， děng dào shí èr diǎn zài hù xiāng shuō xīn nián kuài lè。", "exampleVi": "Năm nay tôi lần đầu đón Tết ở nhà bạn. Chiều giao thừa cả nhà dọn dẹp và dán câu đối. Tối mọi người sum họp ăn tất niên. Bố bạn giải thích ăn cá mang ý nghĩa năm nào cũng dư dả. Sau bữa ăn chúng tôi nói chuyện, chờ mười hai giờ chúc năm mới.", "exampleLabel": "Ngữ cảnh trong bài đọc"}, {"id": "life2-15-718", "han": "萬事如意", "vi": "vạn sự như ý", "pinyin": "wàn shì rú yì", "topic": "Tết & lễ hội", "lesson": 15, "source": "extension", "level": "B1", "usage": 88}, {"id": "life2-15-719", " , "target": "一邊", "q": "我一邊聽，___寫。", "questionPinyin": "wǒ yī biān tīng，___ xiě。", "options": ["一邊", "所以", "但是", "因為"], "optionPinyin": {"一邊": "yī biān", "所以": "suǒ yǐ", "但是": "dàn shì", "因為": "yīn wèi"}, "answer": "一邊", "why": "Hai hành động đồng thời."}, {"id": "book-g3", "lesson": 4, "level": "A2", "title": "除了…還…", "titlePinyin": "chú le … hái …", "note": "Thêm một nội dung bên cạnh điều đã nêu.", "example": "除了英文，我還會說中文。", "pinyin": "chú le yīng wén， wǒ hái huì shuō zhōng wén。", "vi": "Ngoài tiếng Anh tôi còn nói được tiếng Trung.", "target": "還", "q": "除了英文，我___會說中文。", "questionPinyin": "chú le yīng wén， wǒ ___ huì shuō zhōng wén。", "options": ["還", "才", "卻", "只"], "optionPinyin": {"還": "hái", "才": "cái", "卻": "què", "只": "zhǐ"}, "answer": "還", "why": "Thêm một nội dung bên cạnh điều đã nêu."}, {"id": "book-g4", "lesson": 5, "level": "A2", "title": "看起來＋形容詞", "titlePinyin": "kàn qǐ lái ＋ xíng róng cí", "note": "Nhận xét qua hình ảnh, khác với 聽起來 qua âm thanh.", "example": "新郎看起來很高興。", "pinyin": "xīn láng kàn qǐ lái hěn gāo xìng。", "vi": "Chú rể trông rất vui.", "target": "看起來", "q": "照片裡的新郎___很高興。", "questionPinyin": "zhào piān lǐ de xīn láng ___ hěn gāo xìng。", "options": ["看起來", "聽起來", "吃起來", "喝起來"], "optionPinyin": {"看起來": "kàn qǐ lái", "聽起來": "tīng qǐ lái", "吃起來": "chī qǐ lái", "喝起來": "hē qǐ lái"}, "answer": "看起來", "why": "Nhận xét qua hình ảnh, khác với 聽起來 qua âm thanh."}, {"id": "book-g5", "lesson": 6, "level": "A2", "title": "如果…就…", "titlePinyin": "rú guǒ … jiù …", "note": "Điều kiện giả định và kết quả.", "example": "如果房租太貴，我就再找。", "pinyin": "rú guǒ fáng zū tài guì， wǒ jiù zài zhǎo。", "vi": "Nếu thuê đắt quá thì tôi tìm tiếp.", "target": "如果", "q": "___房租太貴，我就再找。", "questionPinyin": "___ fáng zū tài guì， wǒ jiù zài zhǎo。", "options": ["如果", "雖然", "不但", "除了"], "optionPinyin": {"如果": "rú guǒ", "雖然": "suī rán", "不但": "bù dàn", "除了": "chú le"}, "answer": "如果", "why": "Điều kiện giả định và kết quả."}, {"id": "book-g6", "lesson": 7, "level": "A2", "title  "options": ["把", "比", "跟", "向"], "optionPinyin": {"把": "bǎ", "比": "bǐ", "跟": "gēn", "向": "xiàng"}, "answer": "把", "why": "Nêu việc xử lý một đối tượng xác định đến kết quả."}, {"id": "book-g10", "lesson": 11, "level": "B1", "title": "被＋動詞", "titlePinyin": "bèi ＋ dòng cí", "note": "Diễn tả chủ thể chịu tác động. Có thể lược bỏ người gây ra.", "example": "我的錢包被偷走了。", "pinyin": "wǒ de qián bāo bèi tōu zǒu le。", "vi": "Ví của tôi bị lấy trộm rồi.", "target": "被", "q": "我的錢包___偷走了。", "questionPinyin": "wǒ de qián bāo ___ tōu zǒu le。", "options": ["被", "把", "比", "跟"], "optionPinyin": {"被": "bèi", "把": "bǎ", "比": "bǐ", "跟": "gēn"}, "answer": "被", "why": "Diễn tả chủ thể chịu tác động. Có thể lược bỏ người gây ra."}, {"id": "book-g11", "lesson": 12, "level": "B1", "title": "越…越…", "titlePinyin": "yuè … yuè …", "note": "Hai mức độ biến đổi cùng nhau.", "example": "方法越簡單，越容易學。", "pinyin": "fāng fǎ yuè jiǎn dān， yuè róng yì xué。", "vi": "Cách càng đơn giản thì càng dễ học.", "target": "越", "q": "方法越簡單，___容易學。", "questionPinyin": "fāng fǎ yuè jiǎn dān，___ róng yì xué。", "options": ["越", "才", "只", "也"], "optionPinyin": {"越": "yuè", "才": "cái", "只": "zhǐ", "也": "yě"}, "answer": "越", "why": "Hai mức độ biến đổi cùng nhau."}, {"id": "book-g12", "lesson": 13, "level": "B1", "title": "別再…了", "titlePinyin": "bié zài … le", "note": "Yêu cầu ngừng hành động lặp lại.", "example": "別再低頭看手機了。", "pinyin": "bié zài dī tóu kàn shǒu jī le。", "vi": "Đừng cúi đầu xem điện thoại nữa.", "target": "再", "q": "別___低頭看手機了。", "questionPinyin": "bié ___ dī tóu kàn shǒu jī le。", "options": ["再", "才", "就", "都"], "optionPinyin": {"再": "zài", "才": "cái", "就": "jiù", "都": "dōu"}, "answer": "再", "why": "Yêu cầu ngừng hành động lặp lại."}, {"id": "book-g13", "lesson": 14, "level": "B1", "title": "連…都…", "titlePinyin": "lián … dōu …", "note": "Nhấn mạnh ngay cả trường hợp được coi là bất ngờ.", "example": "他連這個字都會寫。", "pinyin": "tā lián zhè ge zì dū huì xiě。", "vi": "Ngay cả chữ này anh ấy cũng biết viết.", "target": "都", "q": "他連這個字___會寫。", "questionPinyin": "tā lián zhè ge zì ___ huì xiě。", "options": ["都", "才", "只", "再"], "optionPinyin": {"都": "dōu", "才": "cái", "只": "zhǐ", "再": "zài"}, "answer": "都", "why": "Nhấn mạnh ngay cả trường hợp được coi là bất ngờ."}, {"id": "book-g14", "lesson": 15, "level": "B1", "title": "動詞＋起來", "titlePinyin": "dòng cí ＋ qǐ lái", "note": "Khởi đầu một hành động hoặc trạng thái.", "example": "快過年了，大家都忙起來了。", "pinyin": "kuài guò nián le， dà jiā dōu máng qǐ lái le。", "vi": "Sắp Tết rồi, mọi người đều bắt đầu bận rộn.", "target": "起來", "q": "快過年了，大家都忙___了。", "questionPinyin": "kuài guò nián le， dà jiā dōu máng ___ le。", "options": ["起來", "不懂", "過去", "不到"], "optionPinyin": {"起來": "qǐ lái", "不懂": "bù dǒng", "過去": "guò qù", "不到": "bú dào"}, "answer": "起來", "why": "Khởi đầu một hành động hoặc trạng thái."}], "dialogues": [{"title": "Một ly cà phê mang đi", "level": "A2", "topic": "Ăn uống", "lines": [["店員", "您好，請問要喝什麼？", "Nín hǎo, qǐngwèn yào hē shénme?", "Chào bạn, bạn muốn uống gì?"], ["你", "我要一杯大杯冰美式，謝謝。", "Wǒ yào yì bēi dà bēi bīng Měishì, xièxie.", "Cho tôi một Americano đá cỡ lớn, cảm ơn."], ["店員", "請問內用還是外帶？", "Qǐngwèn nèi yòng háishì wài dài?", "Bạn dùng tại quán hay mang đi?"], ["你", "外帶，麻煩幫我做少冰。", "Wài dài, máfan bāng wǒ zuò shǎo bīng.", "Mang đi, phiền bạn cho ít đá."]], "q": "Khách muốn uống tại đâu?", "options": ["Mang đi", "Tại quán", "Ở sân ga", "Chưa quyết định"], "answer": "Mang đi"}, {"title": "Hỏi đường ở ga MRT", "level": "A2", "topic": "Đi lại", "lines": [["你", "不好意思，去台北車站要轉車嗎？", "Bù hǎo yìsi, qù Táiběi Chēzhàn yào zhuǎn chē ma?", "Xin lỗi, đi ga Đài Bắc có cần chuyển tàu không?"], ["路人", "要，請在下一站轉紅線。", "Yào, qǐng zài xià yí zhàn zhuǎn hóng xiàn.", "Có, hãy chuyển sang tuyến đỏ ở ga tiếp theo."], ["你", "大概要多久？", "Dàgài yào duō jiǔ?", "Khoảng bao lâu?"], ["路人", "大概二十分鐘。", "Dàgài èrshí fēnzhōng.", "Khoảng hai mươi phút."]], "q": "Cần chuyển tàu ở đâu?", "options": ["Ga tiếp theo", "Ga cuối", "Không cần chuyển", "Ga trước đó"], "answer": "Ga tiếp theo"}, {"title": "Mua đồ ở cửa hàng", "level": "A2", "topic": "Mua sắm", "lines": [["店員", "一共兩百五十元。", "Yígòng liǎng bǎi wǔ shí yuán.", "Tổng cộng 250 Đài tệ."], ["你", "可以刷卡嗎？", "Kěyǐ shuā kǎ ma?", "Có thể thanh toán bằng thẻ không?"], ["店員", "可以，請問有載具嗎？", "Kěyǐ, qǐngwèn yǒu zài jù ma?", "Được, bạn có mã lưu hóa đơn điện tử không?"], ["你", "有，請幫我刷這個條碼。", "Yǒu, qǐng bāng wǒ shuā zhège tiáomǎ.", "Có, hãy quét mã vạch này giúp tôi."]], "q": "載具 ở đây dùng để làm gì?", "options": ["Lưu hóa đơn điện tử", "Nạp thẻ MRT", "Đổi tiền", "Đặt bàn"], "answer": "Lưu hóa đơn điện tử"}, {"title": "Trao đổi tiến độ công việc", "level": "B1", "topic": "Công việc", "lines": [["主管", "這份資料今天能完成嗎？", "Zhè fèn zīliào jīntiān néng wánchéng ma?", "Tài liệu này hôm nay có thể hoàn thành không?"], ["你", "大部分已經完成了，不過還需要確認幾個地方。", "Dà bùfen yǐjīng wánchéng le, búguò hái xūyào quèrèn jǐ ge dìfang.", "Phần lớn đã xong, nhưng còn vài chỗ cần xác nhận."], ["主管", "如果有問題，我們可以一起討論。", "Rúguǒ yǒu wèntí, wǒmen kěyǐ yìqǐ tǎolùn.", "Nếu có vấn đề, chúng ta có thể cùng thảo luận."], ["你", "好的，我會先整理問題，再跟您討論。", "Hǎo de, wǒ huì xiān zhěnglǐ wèntí, zài gēn nín tǎolùn.", "Vâng, tôi sẽ tổng hợp câu hỏi trước rồi trao đổi với anh/chị."]], "q": "Người nói sẽ làm gì trước?", "options": ["Tổng hợp câu hỏi", "Gửi bản cuối", "Xin nghỉ", "Đi họp"], "answer": "Tổng hợp câu hỏi"}, {"title": "Báo đồ hỏng với chủ nhà", "level": "B1", "topic": "Sinh hoạt", "lines": [["你", "房東您好，我房間的冷氣好像壞了。", "Fángdōng nín hǎo, wǒ fángjiān de lěngqì hǎoxiàng huài le.", "Chào anh/chị, điều hòa phòng tôi hình như hỏng rồi."], ["房東", "是完全不能開，還是不冷？", "Shì wánquán bù néng kāi, háishì bù lěng?", "Không bật được hoàn toàn hay không mát?"], ["你", "可以開，但是吹出來的風不冷。", "Kěyǐ kāi, dànshì chuī chūlái de fēng bù lěng.", "Bật được, nhưng gió thổi ra không mát."], ["房東", "我明天下午請人過去修理。", "Wǒ míngtiān xiàwǔ qǐng rén guòqù xiūlǐ.", "Chiều mai tôi sẽ nhờ người đến sửa."]], "q": "Điều hòa gặp vấn đề gì?", "options": ["Bật được nhưng không mát", "Không bật được", "Rò nước", "Quá ồn"], "answer": "Bật được nhưng không mát"}, {"title": "Một kế hoạch cuối tuần", "level": "B1", "topic": "Kế hoạch", "lines": [["朋友", "你週末有什麼打算？", "Nǐ zhōumò yǒu shénme dǎsuàn?", "Cuối tuần bạn có dự định gì?"], ["你", "如果天氣好，我想去爬山。", "Rúguǒ tiānqì hǎo, wǒ xiǎng qù pá shān.", "Nếu thời tiết đẹp, tôi muốn đi leo núi."], ["朋友", "雖然有點遠，但是那裡的風景很好。", "Suīrán yǒudiǎn yuǎn, dànshì nàlǐ de fēngjǐng hěn hǎo.", "Dù hơi xa nhưng cảnh ở đó rất đẹp."], ["你", "那我們先查交通，再決定幾點出發。", "Nà wǒmen xiān chá jiāotōng, zài juédìng jǐ diǎn chūfā.", "Vậy mình tra cách đi trước rồi quyết định mấy giờ xuất phát."]], "q": "Kế hoạch leo núi phụ thuộc vào gì?", "options": ["Thời tiết", "Giá vé", "Công việc", "Đặt phòng"], "answer": "Thời tiết"}], "speaking": [["A2", "Giới thiệu một ngày của bạn", "Kể 4–5 câu về giờ đi làm, bữa trưa và buổi tối.", ["每天", "先…再…", "下班以後"], "我每天八點上班。下班以後，我先吃飯，再學中文。", "Wǒ měitiān bā diǎn shàngbān. Xiàbān yǐhòu, wǒ xiān chī fàn, zài xué Zhōngwén."], ["A2", "Gọi món theo ý mình", "Gọi một đồ uống, nêu kích cỡ, lượng đường, đá và mang đi hay tại quán.", ["我要…", "少冰", "外帶"], "我要一杯大杯紅茶，無糖、少冰，外帶，謝謝。", "Wǒ yào yì bēi dà bēi hóngchá, wú táng, shǎo bīng, wài dài, xièxie."], ["A2", "Hỏi đường khi bị lạc", "Hỏi ga MRT ở đâu, có xa không và mất bao lâu để đi bộ.", ["不好意思", "怎麼走", "多久"], "不好意思，請問捷運站怎麼走？走路大概要多久？", "Bù hǎo yìsi, qǐngwèn jiéyùn zhàn zěnme zǒu? Zǒulù dàgài yào duō jiǔ?"], ["A2", "Xin nói chậm lại", "Nói bạn đang học tiếng Trung, xin đối phương nói chậm và giải thích một từ.", ["正在", "慢一點", "意思"], "我正在學中文。可以請你說慢一點嗎？這個詞是什麼意思？", "Wǒ zhèngzài xué Zhōngwén. Kěyǐ qǐng nǐ shuō màn yì diǎn ma? Zhège cí shì shénme yìsi?"], ["B1", "Một trải nghiệm đáng nhớ", "Kể bạn đã đi đâu, làm gì, cảm nhận ra sao và có muốn quay lại không.", ["去過", "雖然…但是…", "覺得"], "我去過台南。雖然天氣很熱，但是食物很好吃。我覺得那次旅行很有意思。", "Wǒ qù guò Táinán. Suīrán tiānqì hěn rè, dànshì shíwù hěn hǎo chī. Wǒ juéde nà cì lǚxíng hěn yǒu yìsi."], ["B1", "Giải thích một vấn đề ở chỗ làm", "Nêu tiến độ, khó khăn và đề xuất cách giải quyết trong 45–60 giây.", ["已經", "不過", "建議"], "我已經完成大部分的工作，不過有些資料還需要確認。我建議明天一起討論。", "Wǒ yǐjīng wánchéng dà bùfen de gōngzuò, búguò yǒuxiē zīliào hái xūyào quèrèn. Wǒ jiànyì míngtiān yìqǐ tǎolùn."], ["B1", "So sánh hai nơi ở", "So sánh giá thuê, giao thông và môi trường; giải thích bạn chọn nơi nào.", ["比", "比較", "因為…所以…"], "這間房間比那間便宜，而且離捷運站比較近，所以我想租這間。", "Zhè jiān fángjiān bǐ nà jiān piányí, érqiě lí jiéyùn zhàn bǐjiào jìn, suǒyǐ wǒ xiǎng zū zhè jiān."], ["B1", "Kế hoạch học tiếng Trung", "Nêu mục tiêu, khó khăn hiện tại và ba việc bạn sẽ làm để tiến bộ.", ["目標", "如果…就…", "持續"], "我的目標是說中文更自然。如果每天有時間，我就練習十分鐘。我會持續學習。", "Wǒ de mùbiāo shì shuō Zhōngwén gèng zìrán. Rúguǒ měitiān yǒu shíjiān, wǒ jiù liànxí shí fēnzhōng. Wǒ huì chíxù xuéxí."]], "orders": [["A2", "Tôi đi MRT đi làm mỗi ngày.", ["我", "每天", "搭捷運", "上班"]], ["A2", "Xin bạn nói chậm hơn một chút.", ["請你", "說", "慢一點"]], ["A2", "Tôi muốn một ly cà phê mang đi.", ["我", "想要", "一杯咖啡", "外帶"]], ["A2", "Tôi chưa từng đến Đài Nam.", ["我", "沒", "去過", "台南"]], ["A2", "Hôm nay lạnh hơn hôm qua.", ["今天", "比昨天", "冷"]], ["A2", "Tôi ăn trước rồi đi học.", ["我", "先吃飯", "再", "去上課"]], ["B1", "Nếu mai rảnh thì tôi sẽ đi.", ["如果", "明天有空", "我就", "去"]], ["B1", "Dù rất mệt nhưng tôi vẫn muốn luyện tập.", ["雖然", "很累", "但是", "我還想練習"]], ["B1", "Hãy gửi tài liệu cho tôi.", ["請", "把資料", "寄給", "我"]], ["B1", "Tiếng Trung của tôi ngày càng lưu loát.", ["我的中文", "越來越", "流利"]], ["B1", "Quán này không những rẻ mà còn ngon.", ["這家店", "不但便宜", "而且", "好吃"]], ["B1", "Ngoài tiếng Trung tôi còn muốn học tiếng Nhật.", ["除了中文以外", "我", "還想", "學日文"]]], "topics": [{"lesson": 1, "title": "Hỏi đường & vị trí"}, {"lesson": 2, "title": "Giao thông & di chuyển"}, {"lesson": 3, "title": "Học tiếng Trung & sinh hoạt"}, {"lesson": 4, "title": "Việc làm & phỏng vấn"}, {"lesson": 5, "title": "Đám cưới & giao tiếp"}, {"lesson": 6, "title": "Thuê nhà & chuyển nhà"}, {"lesson": 7, "title": "Rác & bảo vệ môi trường"}, {"lesson": 8, "title": "Thể thao & năng lực"}, {"lesson": 9, "title": "Thành phố & trải nghiệm"}, {"lesson": 10, "title": "Nấu ăn & món ăn"}, {"lesson": 11, "title": "Du lịch & an toàn"}, {"lesson": 12, "title": "Ăn uống & sức khỏe"}, {"lesson": 13, "title": "Điện thoại & Internet"}, {"lesson": 14, "title": "Tương lai & nghề nghiệp"}, {"lesson": 15, "title": "Tết & lễ hội"}], "extensions": [{"lesson": 1, "han": "問路=指路=問別人怎麼走", "pinyin": "wèn lù = zhǐ lù = wèn bié rén zěn me zǒu", "vi": "hỏi đường / chỉ đường / hỏi người khác đường đi", "note": "問路 là hỏi, 指路 là chỉ đường cho người khác."}, {"lesson": 1, "han": "附近=周圍=旁邊", "pinyin": "fù jìn = zhōu wéi = páng biān", "vi": "gần đây / xung quanh / bên cạnh", "note": "旁邊 nhấn mạnh ngay bên cạnh, không thay được mọi trường hợp của 附近."}, {"lesson": 1, "han": "往前走→直走", "pinyin": "wǎng qián zǒu → zhí zǒu", "vi": "đi về phía trước → đi thẳng", "note": "直走 là chỉ dẫn ngắn thường gặp."}, {"lesson": 2, "han": "捷運=地鐵=大眾運輸", "pinyin": "jié yùn = dì tiě = dà zhòng yùn shū", "vi": "MRT / tàu điện ngầm / giao thông công cộng", "note": "Ở Đài Loan thường nói 捷運. 大眾運輸 bao gồm nhiều phương tiện."}, {"lesson": 2, "han": "轉車=換車=轉乘", "pinyin": "zhuǎn chē = huàn chē = zhuǎn chéng", "vi": "chuyển xe / đổi xe / chuyển phương tiện", "note": "轉乘 thường xuất hiện trên biển hướng dẫn."}, {"lesson": 2, "han": "不必→不用→不需要", "pinyin": "bù bì → bù yòng → bù xū yào", "vi": "không cần", "note": "不用 phổ biến trong hội thoại, 不需要 nhấn mạnh không có nhu cầu."}, {"lesson": 3, "han": "練習=複習=預習", "pinyin": "liàn xí = fù xí = yù xí", "vi": "luyện tập / ôn bài / chuẩn bị bài trước", "note": "Ba việc học khác nhau."}, {"lesson": 3, "han": "聽得懂↔聽不懂", "pinyin": "tīng de dǒng ↔ tīng bù dǒng", "vi": "nghe hiểu ↔ nghe không hiểu", "note": "Động từ + 得/不 + bổ ngữ chỉ khả năng."}, {"lesson": 3, "han": "雖然…可是…→雖然…但是…", "pinyin": "suī rán … kě shì …→ suī rán … dàn shì …", "vi": "tuy… nhưng…", "note": "可是 gần nghĩa 但是 trong câu tương phản."}, {"lesson": 4, "han": "面談→面試", "pinyin": "miàn tán → miàn shì", "vi": "trao đổi phỏng vấn → phỏng vấn tuyển chọn", "note": "面試 nhấn mạnh đánh giá ứng viên."}, {"lesson": 4, "han": "薪水→薪資", "pinyin": "xīn shuǐ → xīn zī", "vi": "lương", "note": "薪水 thường dùng khi nói, 薪資 thường gặp trong tuyển dụng."}, {"lesson": 4, "han": "應徵=履歷=錄取", "pinyin": "yìng zhēng = lǚ lì = lù qǔ", "vi": "ứng tuyển / hồ sơ / được nhận", "note": "Chuỗi từ thực tế khi tìm việc."}, {"lesson": 5, "han": "請客→我請你", "pinyin": "qǐng kè → wǒ qǐng nǐ", "vi": "mời ăn → để tôi mời bạn", "note": "我請你 ăn uống nghĩa là người nói trả tiền."}, {"lesson": 5, "han": "恭喜→祝福你們", "pinyin": "gōng xǐ → zhù fú nǐ men", "vi": "chúc mừng → chúc phúc hai bạn", "note": "Cách chúc mừng lễ cưới."}, {"lesson": 5, "han": "看起來↔聽起來", "pinyin": "kàn qǐ lái ↔ tīng qǐ lái", "vi": "trông có vẻ ↔ nghe có vẻ", "note": "Chọn theo nguồn thông tin là hình ảnh hay âm thanh."}, {"lesson": 6, "han": "租金=房租=押金", "pinyin": "zū jīn = fáng zū = yā jīn", "vi": "tiền thuê / tiền thuê nhà / tiền đặt cọc", "note": "押金 là khoản riêng với 房租."}, {"lesson": 6, "han": "合適→適合", "pinyin": "hé shì → shì hé", "vi": "vừa vặn → phù hợp với", "note": "這裡很合適 và 這裡適合我 có cấu trúc khác nhau."}, {"lesson": 6, "han": "續約=退租=房東", "pinyin": "xù yuē = tuì zū = fáng dōng", "vi": "gia hạn hợp đồng / trả nhà thuê / chủ nhà", "note": "Nhóm từ liên quan đến hợp đồng thuê."}, {"lesson": 7, "han": "垃圾分類=資源回收", "pinyin": "lè sè fēn lèi = zī yuán huí shōu", "vi": "phân loại rác / tái chế tài nguyên", "note": "Phân loại giúp thu gom đúng nhóm."}, {"lesson": 7, "han": "丟掉→扔掉", "pinyin": "diū diào → rēng diào", "vi": "vứt bỏ", "note": "Ở Đài Loan 丟掉 rất thường gặp trong lời nói."}, {"lesson": 7, "han": "以為…結果…", "pinyin": "yǐ wéi … jié guǒ …", "vi": "tưởng… cuối cùng…", "note": "Diễn đạt kết quả khác với suy nghĩ ban đầu."}, {"lesson": 8, "han": "體力=精神=耐力", "pinyin": "tǐ lì = jīng shén = nài lì", "vi": "thể lực / tinh thần / sức bền", "note": "Không phải từ đồng nghĩa hoàn toàn."}, {"lesson": 8, "han": "學會→會了", "pinyin": "xué huì → huì le", "vi": "học được → đã biết làm rồi", "note": "我學會了 và 我會了 đều có thể báo đã làm được."}, {"lesson": 8, "han": "做得到↔做不到", "pinyin": "zuò de dào ↔ zuò bú dào", "vi": "làm được ↔ không làm được", "note": "Diễn tả khả năng hoàn thành."}, {"lesson": 9, "han": "特色→特點", "pinyin": "tè sè → tè diǎn", "vi": "đặc trưng → đặc điểm", "note": "特色 thường nói nét nổi bật, hấp dẫn."}, {"lesson": 9, "han": "擠→擁擠", "pinyin": "jǐ → yōng jǐ", "vi": "chật → đông đúc", "note": "擁擠 thường dùng để miêu tả nơi đông người."}, {"lesson": 9, "han": "跟…一樣↔跟…不一樣", "pinyin": "gēn … yī yàng ↔ gēn … bù yí yàng", "vi": "giống… ↔ khác…", "note": "Dùng so sánh hai nơi hoặc hai trải nghiệm."}, {"lesson": 10, "han": "做菜→煮飯", "pinyin": "zuò cài → zhǔ fàn", "vi": "nấu món ăn → nấu cơm/nấu ăn", "note": "煮飯 trong hội thoại có thể chỉ chuẩn bị cả bữa."}, {"lesson": 10, "han": "食材=材料=調味料", "pinyin": "shí cái = cái liào = tiáo wèi liào", "vi": "nguyên liệu thực phẩm / nguyên liệu / gia vị", "note": "材料 rộng hơn 食材, 調味料 chỉ gia vị."}, {"lesson": 10, "han": "先…再…最後…", "pinyin": "xiān … zài … zuì hòu …", "vi": "trước… rồi… cuối cùng…", "note": "Trình bày các bước nấu ăn."}, {"lesson": 11, "han": "訂房=預訂=取消", "pinyin": "dìng fáng = yù dìng = qǔ xiāo", "vi": "đặt phòng / đặt trước / hủy", "note": "Dùng khi trao đổi với nơi lưu trú."}, {"lesson": 11, "han": "小心→注意安全", "pinyin": "xiǎo xīn → zhù yì ān quán", "vi": "cẩn thận → chú ý an toàn", "note": "Lời nhắc trước chuyến đi."}, {"lesson": 11, "han": "被…偷走了", "pinyin": "bèi … tōu zǒu le", "vi": "bị… lấy trộm", "note": "Dùng 被 để nói người hoặc đồ chịu tác động."}, {"lesson": 12, "han": "清淡↔油膩", "pinyin": "qīng dàn ↔ yóu nì", "vi": "thanh đạm ↔ nhiều dầu mỡ", "note": "清淡 có thể nói vị nhẹ và ít dầu."}, {"lesson": 12, "han": "有營養→營養豐富", "pinyin": "yǒu yíng yǎng → yíng yǎng fēng fù", "vi": "có dinh dưỡng → giàu dinh dưỡng", "note": "Cụm thứ hai nhấn mạnh hàm lượng phong phú."}, {"lesson": 12, "han": "只要…就…↔只有…才…", "pinyin": "zhǐ yào … jiù …↔ zhǐ yǒu … cái …", "vi": "chỉ cần… thì… ↔ chỉ khi… mới…", "note": "只要 nêu điều kiện đủ, 只有 nêu điều kiện cần."}, {"lesson": 13, "han": "訊息=簡訊=通知", "pinyin": "xùn xī = jiǎn xùn = tōng zhī", "vi": "tin nhắn / SMS / thông báo", "note": "訊息 rộng hơn SMS, 通知 có thể do ứng dụng gửi."}, {"lesson": 13, "han": "立刻→馬上", "pinyin": "lì kè → mǎ shàng", "vi": "ngay lập tức", "note": "Hai từ thường thay nhau trong nhiều ngữ cảnh."}, {"lesson": 13, "han": "別再…了→不要再…了", "pinyin": "bié zài … le → bú yào zài … le", "vi": "đừng… nữa", "note": "Cách yêu cầu dừng một hành động đang lặp lại."}, {"lesson": 14, "han": "認為→覺得", "pinyin": "rèn wéi → jué de", "vi": "cho rằng → cảm thấy/nghĩ", "note": "認為 thường nhấn mạnh ý kiến đã cân nhắc."}, {"lesson": 14, "han": "目標=目的=計畫", "pinyin": "mù biāo = mù dì = jì huà", "vi": "mục tiêu / mục đích / kế hoạch", "note": "Mục tiêu là kết quả hướng tới, kế hoạch là cách thực hiện."}, {"lesson": 14, "han": "不但…還…→不但…而且…", "pinyin": "bù dàn … hái …→ bù dàn … ér qiě …", "vi": "không những… còn…", "note": "Hai cách bổ sung ý tăng tiến."}, {"lesson": 15, "han": "過年→過春節", "pinyin": "guò nián → guò chūn jié", "vi": "đón Tết", "note": "Cùng chỉ dịp Tết trong ngữ cảnh này."}, {"lesson": 15, "han": "紅包=壓歲錢", "pinyin": "hóng bāo = yā suì qián", "vi": "phong bao đỏ / tiền mừng tuổi", "note": "紅包 còn được dùng ở lễ cưới và nhiều dịp khác."}, {"lesson": 15, "han": "祝你…→祝大家…", "pinyin": "zhù nǐ …→ zhù dà jiā …", "vi": "chúc bạn… → chúc mọi người…", "note": "Đổi người nhận lời chúc."}], "readings": [{"id": "book-r0", "lesson": 1, "level": "A2", "title": "Tìm lớp học mới", "han": "我今天第一次去新的教室。地圖上寫，從車站往前走，過第二個紅綠燈再右轉。我怕迷路，就問了一位路人。他告訴我，教室在郵局對面，走路只要五分鐘。", "pinyin": "wǒ jīn tiān dì yī cì qù xīn de jiào shì。 dì tú shàng xiě， cóng chē zhàn wǎng qián zǒu， guò dì èr gè hóng lǜ dēng zài yòu zhuǎn。 wǒ pà mí lù， jiù wèn le yī wèi lù rén。 tā gào sù wǒ， jiào shì zài yóu jú duì miàn， zǒu lù zhǐ yào wǔ fēn zhōng。", "vi": "Hôm nay tôi lần đầu đến lớp mới. Bản đồ ghi đi thẳng từ ga, qua đèn thứ hai rồi rẽ phải. Sợ lạc nên tôi hỏi một người đi đường. Người đó nói lớp học đối diện bưu điện, đi bộ chỉ năm phút.", "questions": [{"q": "教室在哪裡？", "pinyin": "jiào shì zài nǎ lǐ？", "options": ["郵局對面", "車站裡面", "海邊", "公園後面"], "readings": {"郵局對面": "yóu jú duì miàn", "車站裡面": "chē zhàn lǐ miàn", "海邊": "hǎi biān", "公園後面": "gōng yuán hòu miàn"}, "answer": "郵局對面", "why": "Văn bản nói rõ lớp học đối diện bưu điện."}, {"q": "他為什麼問路人？", "pinyin": "tā wèi shén me wèn lù rén？", "options": ["怕迷路", "想買郵票", "沒有錢", "想搭飛機"], "readings": {"怕迷路": "pà mí lù", "想買郵票": "xiǎng mǎi yóu piào", "沒有錢": "méi yǒu qián", "想搭飛機": "xiǎng dā fēi jī"}, "answer": "怕迷路", "why": "Người kể hỏi đường vì sợ lạc."}], "blanks": ["往前", "右轉", "對面"], "cloze": "我今天第一次去新的教室。地圖上寫，從車站〔1〕走，過第二個紅綠燈再〔2〕。我怕迷路，就問了一位路人。他告訴我，教室在郵局〔3〕，走路只要五分鐘。", "clozePinyin": "wǒ jīn tiān dì yī cì qù xīn de jiào shì。 dì tú shàng xiě， cóng chē zhàn 〔1〕 zǒu， guò dì èr gè hóng lǜ dēng zài 〔2〕。 wǒ pà mí lù， jiù wèn le yī wèi lù rén。 tā gào sù wǒ， jiào shì zài yóu jú 〔3〕， zǒu lù zhǐ yào wǔ fēn zhōng。", "source": "Đoạn mới biên soạn theo chủ đề và từ vựng của bài 1."}, {"id": "book-r1", "lesson": 2, "level": "A2", "title": "Chọn phương tiện", "han": "星期六我要跟朋友去看電腦展。本來想搭公車，可是朋友說，週末路上車多，坐捷運比較輕鬆。我們決定十點在車站見，再一起走到展覽館。朋友提醒我帶悠遊卡。", "pinyin": "xīng qī liù wǒ yào gēn péng yǒu qù kàn diàn nǎo zhǎn。 běn lái xiǎng dā gōng chē， kě shì péng yǒu shuō， zhōu mò lù shàng chē duō， zuò jié yùn bǐ jiào qīng sōng。 wǒ men jué dìng shí diǎn zài chē zhàn jiàn， zài yì qǐ zǒu dào zhǎn lǎn guǎn。 péng yǒu tí xǐng wǒ dài yōu yóu kǎ。", "vi": "Thứ Bảy tôi đi xem triển lãm máy tính cùng bạn. Ban đầu định đi xe buýt nhưng bạn nói cuối tuần đông xe, đi MRT thoải mái hơn. Chúng tôi hẹn mười giờ ở ga rồi đi bộ tới nhà triển lãm. Bạn nhắc tôi mang EasyCard.", "questions": [{"q": "他們最後選擇什麼交通工具？", "pinyin": "tā men zuì hòu xuǎn zé shén me jiāo tōng gōng jù？", "options": ["捷運", "飛機", "船", "腳踏車"], "readings": {"捷運": "jié yùn", "飛機": "fēi jī", "船": "chuán", "腳踏車": "jiǎo tà chē"}, "answer": "捷運", "why": "Họ chọn MRT sau khi cân nhắc giao thông cuối tuần."}, {"q": "他們幾點見面？", "pinyin": "tā men jǐ diǎn jiàn miàn？", "options": ["十點", "八點", "十二點", "下午三點"], "readings": {"十點": "shí diǎn", "八點": "bā diǎn", "十二點": "shí èr diǎn", "下午三點": "xià wǔ sān diǎn"}, "answer": "十點", "why": "Hai người hẹn nhau lúc mười giờ."}], "blanks": ["朋友", "決定", "車站"], "cloze": "星期六我要跟〔1〕去看電腦展。本來想搭公車，可是朋友說，週末路上車多，坐捷運比較輕鬆。我們〔2〕十點在〔3〕見，再一起走到展覽館。朋友提醒我帶悠遊卡。", "clozePinyin": "xīng qī liù wǒ yào gēn 〔1〕 qù kàn diàn nǎo zhǎn。 běn lái xiǎng dā gōng chē， kě shì péng yǒu shuō， zhōu mò lù shàng chē duō， zuò jié yùn bǐ jiào qīng sōng。 wǒ men 〔2〕 shí diǎn zài 〔3〕 jiàn， zài yì qǐ zǒu dào zhǎn lǎn guǎn。 péng yǒu tí xǐng wǒ dài yōu yóu kǎ。", "source": "Đoạn mới biên soạn theo chủ đề và từ vựng của bài 2."}, {"id": "book-r2", "lesson": 3, "level": "A2", "title": "Luyện nói mỗi ngày", "han": "我以前聽得懂一點中文，可是說得不太流利。這個月我決定每天跟同學聊天十分鐘。遇到不懂的漢字，我先記在本子上，晚上再查。雖然準備作業的時間變長了，但是我覺得自己進步了。", "pinyin": "wǒ yǐ qián tīng de dǒng yì diǎn zhōng wén， kě shì shuō de bù tài liú lì。 zhè ge yuè wǒ jué dìng měi tiān gēn tóng xué liáo tiān shí fēn zhōng。 yù dào bù dǒng de hàn zì， wǒ xiān jì zài běn zi shàng， wǎn shàng zài chá。 suī rán zhǔn bèi zuò yè de shí jiān biàn cháng le， dàn shì wǒ jué de zì jǐ jìn bù le。", "vi": "Trước đây tôi nghe hiểu chút tiếng Trung nhưng nói chưa lưu loát. Tháng này tôi quyết định trò chuyện với bạn học mười phút mỗi ngày. Gặp chữ chưa hiểu, tôi ghi vào vở rồi tối tra. Tuy làm bài lâu hơn nhưng tôi thấy mình tiến bộ.", "questions": [{"q": "他每天怎麼練習口說？", "pinyin": "tā měi tiān zěn me liàn xí kǒu shuō？", "options": ["跟同學聊天", "只看英文電影", "每天換老師", "整天不說話"], "readings": {"跟同學聊天": "gēn tóng xué liáo tiān", "只看英文電影": "zhǐ kàn yīng wén diàn yǐng", "每天換老師": "měi tiān huàn lǎo shī", "整天不說話": "zhěng tiān bù shuō huà"}, "answer": "跟同學聊天", "why": "Người kể luyện nói bằng trò chuyện với bạn học."}, {"q": "遇到不懂的字，他先做什麼？", "pinyin": "yù dào bù dǒng de zì， tā xiān zuò shén me？", "options": ["記在本子上", "馬上睡覺", "丟掉課本", "放棄學習"], "readings": {"記在本子上": "jì zài běn zi shàng", "馬上睡覺": "mǎ shàng shuì jiào", "丟掉課本": "diū diào kè běn", "放棄學習": "fàng qì xué xí"}, "answer": "記在本子上", "why": "Người kể ghi chữ vào vở trước khi tra vào buổi tối."}], "blanks": ["流利", "決定", "進步"], "cloze": "我以前聽得懂一點中文，可是說得不太〔1〕。這個月我〔2〕每天跟同學聊天十分鐘。遇到不懂的漢字，我先記在本子上，晚上再查。雖然準備作業的時間變長了，但是我覺得自己〔3〕了。", "clozePinyin": "wǒ yǐ qián tīng de dǒng yì diǎn zhōng wén， kě shì shuō de bù tài 〔1〕。 zhè ge yuè wǒ 〔2〕 měi tiān gēn tóng xué liáo tiān shí fēn zhōng。 yù dào bù dǒng de hàn zì， wǒ xiān jì zài běn zi shàng， wǎn shàng zài chá。 suī rán zhǔn bèi zuò yè de shí jiān biàn cháng le， dàn shì wǒ jué de zì jǐ 〔3〕 le。", "source": "Đoạn mới biên soạn theo chủ đề và từ vựng của bài 3."}, {"id": "book-r3", "lesson": 4, "level": "A2", "title": "Một buổi phỏng vấn", "han": "美玲想找一份週末的工作。她先把履歷表寄給學校，三天後收到面談通知。主任問她有沒有教書的經驗。美玲說，她以前當過助教。面談以後，主任請她星期五再來，討論薪水和上班時間。", "pinyin": "měi líng xiǎng zhǎo yī fèn zhōu mò de gōng zuò。 tā xiān bǎ lǚ lì biǎo jì gěi xué xiào， sān tiān hòu shōu dào miàn tán tōng zhī。 zhǔ rèn wèn tā yǒu méi yǒu jiāo shū de jīng yàn。 měi líng shuō， tā yǐ qián dāng guò zhù jiào。 miàn tán yǐ hòu， zhǔ rèn qǐng tā xīng qī wǔ zài lái， tǎo lùn xīn shuǐ hé shàng bān shí jiān。", "vi": "Mỹ Linh muốn tìm việc cuối tuần. Cô gửi hồ sơ đến trường và ba ngày sau nhận thông báo phỏng vấn. Chủ nhiệm hỏi kinh nghiệm dạy học. Cô từng làm trợ giảng. Sau phỏng vấn, chủ nhiệm mời cô trở lại thứ Sáu để bàn lương và giờ làm.", "questions": [{"q": "美玲以前做過什麼？", "pinyin": "měi líng yǐ qián zuò guò shén me？", "options": ["助教", "醫生", "司機", "廚師"], "readings": {"助教": "zhù jiào", "醫生": "yī shēng", "司機": "sī jī", "廚師": "chú shī"}, "answer": "助教", "why": "Cô cho biết từng làm trợ giảng."}, {"q": "星期五要討論什麼？", "pinyin": "xīng qī wǔ yào tǎo lùn shén me？", "options": ["薪水和上班時間", "婚禮的座位", "機票和旅館", "晚餐的材料"], "readings": {"薪水和上班時間": "xīn shuǐ hé shàng bān shí jiān", "婚禮的座位": "hūn lǐ de zuò wèi", "機票和旅館": "jī piào hé lǚ guǎn", "晚餐的材料": "wǎn cān de cái liào"}, "answer": "薪水和上班時間", "why": "Chủ nhiệm muốn trao đổi lương và giờ làm vào thứ Sáu."}], "blanks": ["工作", "經驗", "薪水"], "cloze": "美玲想找一份週末的〔1〕。她先把履歷表寄給學校，三天後收到面談通知。主任問她有沒有教書的〔2〕。美玲說，她以前當過助教。面談以後，主任請她星期五再來，討論〔3〕和上班時間。", "clozePinyin": "měi líng xiǎng zhǎo yī fèn zhōu mò de 〔1〕。 tā xiān bǎ lǚ lì biǎo jì gěi xué xiào， sān tiān hòu shōu dào miàn tán tōng zhī。 zhǔ rèn wèn tā yǒu méi yǒu jiāo shū de 〔2〕。 měi líng shuō， tā yǐ qián dāng guò zhù jiào。 miàn tán yǐ hòu， zhǔ rèn qǐng tā xīng qī wǔ zài lái， tǎo lùn 〔3〕 hé shàng bān shí jiān。", "source": "Đoạn mới biên soạn theo chủ đề và từ vựng của bài 4."}, {"id": "book-r4", "lesson": 5, "level": "A2", "title": "Đi dự lễ cưới", "han": "朋友下個月結婚，請我去喝喜酒。我想穿平常上課的衣服，可是室友說，婚禮穿正式一點比較好。我們打算一起去，先跟新人說恭喜，再找自己的座位。室友也提醒我準備紅包。", "pinyin": "péng yǒu xià gè yuè jié hūn， qǐng wǒ qù hē xǐ jiǔ。 wǒ xiǎng chuān píng cháng shàng kè de yī fú， kě shì shì yǒu shuō， hūn lǐ chuān zhèng shì yì diǎn bǐ jiào hǎo。 wǒ men dǎ suàn yì qǐ qù， xiān gēn xīn rén shuō gōng xǐ， zài zhǎo zì jǐ de zuò wèi。 shì yǒu yě tí xǐng wǒ zhǔn bèi hóng bāo。", "vi": "Bạn tôi cưới tháng sau và mời tôi dự tiệc. Tôi định mặc đồ đi học nhưng bạn cùng phòng nói nên mặc trang trọng hơn. Chúng tôi sẽ cùng đi, chúc mừng cô dâu chú rể rồi tìm chỗ. Bạn cũng nhắc tôi chuẩn bị phong bì.", "questions": [{"q": "室友建議穿什麼衣服？", "pinyin": "shì yǒu jiàn yì chuān shén me yī fú？", "options": ["正式一點的衣服", "游泳衣", "睡衣", "運動短褲"], "readings": {"正式一點的衣服": "zhèng shì yì diǎn de yī fú", "游泳衣": "yóu yǒng yī", "睡衣": "shuì yī", "運動短褲": "yùn dòng duǎn kù"}, "answer": "正式一點的衣服", "why": "Bạn cùng phòng khuyên ăn mặc trang trọng."}, {"q": "到了婚禮，他們先做什麼？", "pinyin": "dào le hūn lǐ， tā men xiān zuò shén me？", "options": ["跟新人說恭喜", "去機場", "打掃廚房", "找工作"], "readings": {"跟新人說恭喜": "gēn xīn rén shuō gōng xǐ", "去機場": "qù jī chǎng", "打掃廚房": "dǎ sǎo chú fáng", "找工作": "zhǎo gōng zuò"}, "answer": "跟新人說恭喜", "why": "Họ định chúc mừng cặp đôi trước khi tìm chỗ."}], "blanks": ["結婚", "正式", "座位"], "cloze": "朋友下個月〔1〕，請我去喝喜酒。我想穿平常上課的衣服，可是室友說，婚禮穿〔2〕一點比較好。我們打算一起去，先跟新人說恭喜，再找自己的〔3〕。室友也提醒我準備紅包。", "clozePinyin": "péng yǒu xià gè yuè 〔1〕， qǐng wǒ qù hē xǐ jiǔ。 wǒ xiǎng chuān píng cháng shàng kè de yī fú， kě shì shì yǒu shuō， hūn lǐ chuān 〔2〕 yì diǎn bǐ jiào hǎo。 wǒ men dǎ suàn yì qǐ qù， xiān gēn xīn rén shuō gōng xǐ， zài zhǎo zì jǐ de 〔3〕。 shì yǒu yě tí xǐng wǒ zhǔn bèi hóng bāo。", "source": "Đoạn mới biên soạn theo chủ đề và từ vựng của bài 5."}, {"id": "book-r5", "lesson": 6, "level": "A2", "title": "Chuyển đến gần trường", "han": "我的合約快到期了，所以最近一直找房子。有一間房間離學校很近，光線也好，可是沒有家具。另一間比較遠，但是有床、桌子和椅子。我考慮了兩天，最後決定租近的那間，再慢慢買家具。", "pinyin": "wǒ de hé yuē kuài dào qī le， suǒ yǐ zuì jìn yì zhí zhǎo fáng zi。 yǒu yī jiān fáng jiān lí xué xiào hěn jìn， guāng xiàn yě hǎo， kě shì méi yǒu jiā jù。 lìng yī jiān bǐ jiào yuǎn， dàn shì yǒu chuáng、 zhuō zi hé yǐ zi。 wǒ kǎo lǜ le liǎng tiān， zuì hòu jué dìng zū jìn de nà jiān， zài màn màn mǎi jiā jù。", "vi": "Hợp đồng của tôi sắp hết nên tôi đang tìm phòng. Một phòng gần trường, sáng nhưng không có nội thất. Phòng kia xa hơn nhưng có giường bàn ghế. Cân nhắc hai ngày, tôi chọn phòng gần rồi mua nội thất dần.", "questions": [{"q": "他最後選哪間房？", "pinyin": "tā zuì hòu xuǎn nǎ jiān fáng？", "options": ["離學校近的", "在機場裡的", "比較遠的", "光線差的"], "readings": {"離學校近的": "lí xué xiào jìn de", "在機場裡的": "zài jī chǎng lǐ de", "比較遠的": "bǐ jiào yuǎn de", "光線差的": "guāng xiàn chà de"}, "answer": "離學校近的", "why": "Người kể cuối cùng chọn phòng gần trường."}, {"q": "近的房間有什麼問題？", "pinyin": "jìn de fáng jiān yǒu shén me wèn tí？", "options": ["沒有家具", "合約太長", "不能住人", "沒有窗戶"], "readings": {"沒有家具": "méi yǒu jiā jù", "合約太長": "hé yuē tài cháng", "不能住人": "bù néng zhù rén", "沒有窗戶": "méi yǒu chuāng hù"}, "answer": "沒有家具", "why": "Phòng gần không có nội thất."}], "blanks": ["合約", "家具", "考慮"], "cloze": "我的〔1〕快到期了，所以最近一直找房子。有一間房間離學校很近，光線也好，可是沒有〔2〕。另一間比較遠，但是有床、桌子和椅子。我〔3〕了兩天，最後決定租近的那間，再慢慢買家具。", "clozePinyin": "wǒ de 〔1〕 kuài dào qī le， suǒ yǐ zuì jìn yì zhí zhǎo fáng zi。 yǒu yī jiān fáng jiān lí xué xiào hěn jìn， guāng xiàn yě hǎo， kě shì méi yǒu 〔2〕。 lìng yī jiān bǐ jiào yuǎn， dàn shì yǒu chuáng、 zhuō zi hé yǐ zi。 wǒ 〔3〕 le liǎng tiān， zuì hòu jué dìng zū jìn de nà jiān， zài màn màn mǎi jiā jù。", "source": "Đoạn mới biên soạn theo chủ đề và từ vựng của bài 6."}, {"id": "book-r6", "lesson": 7, "level": "A2", "title": "Đổ rác đúng cách", "han": "我剛搬到這個社區，不知道垃圾車幾點來。鄰居告訴我，晚上八點在路口等，垃圾要先分類。紙和瓶子可以回收。我本來以為紙杯都可以跟一般垃圾放一起，後來才知道應該先看社區的規定。", "pinyin": "wǒ gāng bān dào zhè ge shè qū， bù zhī dào lè sè chē jǐ diǎn lái。 lín jū gào sù wǒ， wǎn shàng bā diǎn zài lù kǒu děng， lè sè yào xiān fēn lèi。 zhǐ hé píng zi kě yǐ huí shōu。 wǒ běn lái yǐ wéi zhǐ bēi dōu kě yǐ gēn yì bān lè sè fàng yì qǐ， hòu lái cái zhī dào yīng gāi xiān kàn shè qū de guī dìng。", "vi": "Tôi mới chuyển đến khu này nên chưa biết giờ xe rác. Hàng xóm bảo chờ ở giao lộ lúc tám giờ tối và phân loại trước. Giấy và chai có thể tái chế. Ban đầu tôi tưởng cốc giấy cứ bỏ với rác thường, sau mới biết phải xem quy định của khu.", "questions": [{"q": "垃圾車什麼時候來？", "pinyin": "lè sè chē shén me shí hòu lái？", "options": ["晚上八點", "早上六點", "中午十二點", "下午三點"], "readings": {"晚上八點": "wǎn shàng bā diǎn", "早上六點": "zǎo shàng liù diǎn", "中午十二點": "zhōng wǔ shí èr diǎn", "下午三點": "xià wǔ sān diǎn"}, "answer": "晚上八點", "why": "Hàng xóm hướng dẫn đợi lúc tám giờ tối."}, {"q": "倒垃圾以前要做什麼？", "pinyin": "dào lè sè yǐ qián yào zuò shén me？", "options": ["先分類", "先買機票", "先上傳照片", "先訂旅館"], "readings": {"先分類": "xiān fēn lèi", "先買機票": "xiān mǎi jī piào", "先上傳照片": "xiān shàng chuán zhào piān", "先訂旅館": "xiān dìng lǚ guǎn"}, "answer": "先分類", "why": "Bài nhấn mạnh phân loại trước khi mang rác đi."}], "blanks": ["鄰居", "分類", "規定"], "cloze": "我剛搬到這個社區，不知道垃圾車幾點來。〔1〕告訴我，晚上八點在路口等，垃圾要先〔2〕。紙和瓶子可以回收。我本來以為紙杯都可以跟一般垃圾放一起，後來才知道應該先看社區的〔3〕。", "clozePinyin": "wǒ gāng bān dào zhè ge shè qū， bù zhī dào lè sè chē jǐ diǎn lái。〔1〕 gào sù wǒ， wǎn shàng bā diǎn zài lù kǒu děng， lè sè yào xiān 〔2〕。 zhǐ hé píng zi kě yǐ huí shōu。 wǒ běn lái yǐ wéi zhǐ bēi dōu kě yǐ gēn yì bān lè sè fàng yì qǐ， hòu lái cái zhī dào yīng gāi xiān kàn shè qū de 〔3〕。", "source": "Đoạn mới biên soạn theo chủ đề và từ vựng của bài 7."}, {"id": "book-r7", "lesson": 8, "level": "B1", "title": "Lần đầu tập thái cực quyền", "han": "同學帶我去公園練太極拳。第一天，我覺得動作很慢，應該不難。可是練了半小時，腿就很酸。師父說，不必急，先把動作學好，再繼續練。我雖然累，卻想下星期再來。", "pinyin": "tóng xué dài wǒ qù gōng yuán liàn tài jí quán。 dì yī tiān， wǒ jué de dòng zuò hěn màn， yīng gāi bù nán。 kě shì liàn le bàn xiǎo shí， tuǐ jiù hěn suān。 shī fù shuō， bù bì jí， xiān bǎ dòng zuò xué hǎo， zài jì xù liàn。 wǒ suī rán lèi， què xiǎng xià xīng qī zài lái。", "vi": "Bạn học dẫn tôi tới công viên tập thái cực quyền. Ngày đầu tôi nghĩ động tác chậm chắc không khó. Nhưng nửa tiếng sau chân đã mỏi. Thầy bảo đừng vội, học động tác đúng rồi tiếp tục tập. Dù mệt tôi vẫn muốn quay lại tuần sau.", "questions": [{"q": "練習半小時後，他怎麼了？", "pinyin": "liàn xí bàn xiǎo shí hòu， tā zěn me le？", "options": ["腿很酸", "馬上睡著", "手機不見", "完全不累"], "readings": {"腿很酸": "tuǐ hěn suān", "馬上睡著": "mǎ shàng shuì zháo", "手機不見": "shǒu jī bú jiàn", "完全不累": "wán quán bù lèi"}, "answer": "腿很酸", "why": "Sau nửa tiếng tập, chân người kể bị mỏi."}, {"q": "師父有什麼建議？", "pinyin": "shī fù yǒu shén me jiàn yì？", "options": ["先學好動作", "不要再來", "立刻比賽", "只看不練"], "readings": {"先學好動作": "xiān xué hǎo dòng zuò", "不要再來": "bú yào zài lái", "立刻比賽": "lì kè bǐ sài", "只看不練": "zhǐ kàn bù liàn"}, "answer": "先學好動作", "why": "Thầy khuyên học đúng động tác trước."}], "blanks": ["動作", "繼續", "下星期"], "cloze": "同學帶我去公園練太極拳。第一天，我覺得〔1〕很慢，應該不難。可是練了半小時，腿就很酸。師父說，不必急，先把動作學好，再〔2〕練。我雖然累，卻想〔3〕再來。", "clozePinyin": "tóng xué dài wǒ qù gōng yuán liàn tài jí quán。 dì yī tiān， wǒ jué de 〔1〕 hěn màn， yīng gāi bù nán。 kě shì liàn le bàn xiǎo shí， tuǐ jiù hěn suān。 shī fù shuō， bù bì jí， xiān bǎ dòng zuò xué hǎo， zài 〔2〕 liàn。 wǒ suī rán lèi， què xiǎng 〔3〕 zài lái。", "source": "Đoạn mới biên soạn theo chủ đề và từ vựng của bài 8."}, {"id": "book-r8", "lesson": 9, "level": "B1", "title": "Thành phố và nông thôn", "han": "我週末從台北到南部的小鎮旅行。那裡沒有很多高樓，馬路也沒有台北那麼擠。我在廟附近喝了一杯檸檬飲料，味道有一點酸。最讓我難忘的是當地人的熱情，下次還想再去。", "pinyin": "wǒ zhōu mò cóng tái běi dào nán bù de xiǎo zhèn lǚ xíng。 nà lǐ méi yǒu hěn duō gāo lóu， mǎ lù yě méi yǒu tái běi nà me jǐ。 wǒ zài miào fù jìn hē le yī bēi níng méng yǐn liào， wèi dào yǒu yì diǎn suān。 zuì ràng wǒ nán wàng de shì dāng dì rén de rè qíng， xià cì hái xiǎng zài qù。", "vi": "Cuối tuần tôi từ Đài Bắc đến thị trấn miền Nam. Ở đó ít nhà cao tầng và đường không đông như Đài Bắc. Tôi uống nước chanh gần đền, vị hơi chua. Điều khó quên nhất là sự nhiệt tình của người dân, lần sau tôi muốn trở lại.", "questions": [{"q": "他覺得當地人怎麼樣？", "pinyin": "tā jué de dāng dì rén zěn me yàng？", "options": ["很熱情", "都很生氣", "都不說話", "不願意幫忙"], "readings": {"很熱情": "hěn rè qíng", "都很生氣": "dōu hěn shēng qì", "都不說話": "dōu bù shuō huà", "不願意幫忙": "bù yuàn yì bāng máng"}, "answer": "很熱情", "why": "Người kể nhớ nhất sự nhiệt tình của dân địa phương."}, {"q": "飲料是什麼味道？", "pinyin": "yǐn liào shì shén me wèi dào？", "options": ["有一點酸", "很鹹", "完全沒味道", "很油膩"], "readings": {"有一點酸": "yǒu yì diǎn suān", "很鹹": "hěn xián", "完全沒味道": "wán quán méi wèi dào", "很油膩": "hěn yóu nì"}, "answer": "有一點酸", "why": "Ly nước chanh có vị hơi chua."}], "blanks": ["南部", "味道", "熱情"], "cloze": "我週末從台北到〔1〕的小鎮旅行。那裡沒有很多高樓，馬路也沒有台北那麼擠。我在廟附近喝了一杯檸檬飲料，〔2〕有一點酸。最讓我難忘的是當地人的〔3〕，下次還想再去。", "clozePinyin": "wǒ zhōu mò cóng tái běi dào 〔1〕 de xiǎo zhèn lǚ xíng。 nà lǐ méi yǒu hěn duō gāo lóu， mǎ lù yě méi yǒu tái běi nà me jǐ。 wǒ zài miào fù jìn hē le yī bēi níng méng yǐn liào，〔2〕 yǒu yì diǎn suān。 zuì ràng wǒ nán wàng de shì dāng dì rén de 〔3〕， xià cì hái xiǎng zài qù。", "source": "Đoạn mới biên soạn theo chủ đề và từ vựng của bài 9."}, {"id": "book-r9", "lesson": 10, "level": "B1", "title": "Cùng nấu sủi cảo", "han": "星期天我們到老師家包餃子。老師先請大家洗手，再把白菜切好，跟肉一起拌。我第一次包的餃子太扁，煮的時候破了。老師笑著說，餡兒不要放太多。後來我包得越來越好，最後大家把餃子吃光了。", "pinyin": "xīng qī tiān wǒ men dào lǎo shī jiā bāo jiǎo zi。 lǎo shī xiān qǐng dà jiā xǐ shǒu， zài bǎ bái cài qiè hǎo， gēn ròu yì qǐ bàn。 wǒ dì yī cì bāo de jiǎo zi tài biǎn， zhǔ de shí hòu pò le。 lǎo shī xiào zhe shuō， xiànr bú yào fàng tài duō。 hòu lái wǒ bāo de yuè lái yuè hǎo， zuì hòu dà jiā bǎ jiǎo zi chī guāng le。", "vi": "Chủ nhật chúng tôi đến nhà thầy gói sủi cảo. Thầy bảo rửa tay rồi cắt cải thảo, trộn cùng thịt. Bánh đầu tôi gói quá dẹt, luộc bị rách. Thầy cười bảo đừng cho nhiều nhân. Sau tôi gói tốt dần, cuối cùng mọi người ăn hết.", "questions": [{"q": "老師先請大家做什麼？", "pinyin": "lǎo shī xiān qǐng dà jiā zuò shén me？", "options": ["洗手", "買車票", "換衣服", "睡覺"], "readings": {"洗手": "xǐ shǒu", "買車票": "mǎi chē piào", "換衣服": "huàn yī fú", "睡覺": "shuì jiào"}, "answer": "洗手", "why": "Bước đầu là rửa tay."}, {"q": "老師說餡兒應該怎麼放？", "pinyin": "lǎo shī shuō xiànr yīng gāi zěn me fàng？", "options": ["不要放太多", "越多越好", "完全不能放", "煮好以後再放"], "readings": {"不要放太多": "bú yào fàng tài duō", "越多越好": "yuè duō yuè hǎo", "完全不能放": "wán quán bù néng fàng", "煮好以後再放": "zhǔ hǎo yǐ hòu zài fàng"}, "answer": "不要放太多", "why": "Thầy khuyên không cho quá nhiều nhân."}], "blanks": ["洗手", "餃子", "吃光"], "cloze": "星期天我們到老師家包〔2〕。老師先請大家〔1〕，再把白菜切好，跟肉一起拌。我第一次包的餃子太扁，煮的時候破了。老師笑著說，餡兒不要放太多。後來我包得越來越好，最後大家把餃子〔3〕了。", "clozePinyin": "xīng qī tiān wǒ men dào lǎo shī jiā bāo 〔2〕。 lǎo shī xiān qǐng dà jiā 〔1〕， zài bǎ bái cài qiè hǎo， gēn ròu yì qǐ bàn。 wǒ dì yī cì bāo de jiǎo zi tài biǎn， zhǔ de shí hòu pò le。 lǎo shī xiào zhe shuō， xiànr bú yào fàng tài duō。 hòu lái wǒ bāo de yuè lái yuè hǎo， zuì hòu dà jiā bǎ jiǎo zi 〔3〕 le。", "source": "Đoạn mới biên soạn theo chủ đề và từ vựng của bài 10."}, {"id": "book-r10", "lesson": 11, "level": "B1", "title": "Chuyến đi suối nước nóng", "han": "假期我想去泡溫泉，朋友建議先訂民宿。我在網站上看了照片，也把交通資料看了一遍。到了以後，才發現民宿離車站比想的遠。還好老闆願意來接我們。我們決定第二天再去湖邊走走。", "pinyin": "jià qī wǒ xiǎng qù pào wēn quán， péng yǒu jiàn yì xiān dìng mín sù。 wǒ zài wǎng zhàn shàng kàn le zhào piān， yě bǎ jiāo tōng zī liào kàn le yī biàn。 dào le yǐ hòu， cái fā xiàn mín sù lí chē zhàn bǐ xiǎng de yuǎn。 hái hǎo lǎo bǎn yuàn yì lái jiē wǒ men。 wǒ men jué dìng dì èr tiān zài qù hú biān zǒu zǒu。", "vi": "Kỳ nghỉ tôi muốn tắm suối nóng, bạn khuyên đặt homestay trước. Tôi xem ảnh và đọc thông tin đi lại một lượt. Đến nơi mới thấy chỗ ở xa ga hơn tưởng. May chủ nhà đón chúng tôi. Chúng tôi quyết định hôm sau ra hồ đi dạo.", "questions": [{"q": "民宿跟他想的一樣嗎？", "pinyin": "mín sù gēn tā xiǎng de yī yàng ma？", "options": ["比想的離車站遠", "比想的便宜一半", "完全沒有房間", "就在車站裡"], "readings": {"比想的離車站遠": "bǐ xiǎng de lí chē zhàn yuǎn", "比想的便宜一半": "bǐ xiǎng de pián yi yí bàn", "完全沒有房間": "wán quán méi yǒu fáng jiān", "就在車站裡": "jiù zài chē zhàn lǐ"}, "answer": "比想的離車站遠", "why": "Khi đến mới phát hiện nơi ở xa ga hơn dự tính."}, {"q": "誰來接他們？", "pinyin": "shuí lái jiē tā men？", "options": ["民宿老闆", "老師", "醫生", "同學的妹妹"], "readings": {"民宿老闆": "mín sù lǎo bǎn", "老師": "lǎo shī", "醫生": "yī shēng", "同學的妹妹": "tóng xué de mèi mèi"}, "answer": "民宿老闆", "why": "Chủ homestay sẵn lòng đến đón."}], "blanks": ["建議", "交通", "決定"], "cloze": "假期我想去泡溫泉，朋友〔1〕先訂民宿。我在網站上看了照片，也把〔2〕資料看了一遍。到了以後，才發現民宿離車站比想的遠。還好老闆願意來接我們。我們〔3〕第二天再去湖邊走走。", "clozePinyin": "jià qī wǒ xiǎng qù pào wēn quán， péng yǒu 〔1〕 xiān dìng mín sù。 wǒ zài wǎng zhàn shàng kàn le zhào piān， yě bǎ 〔2〕 zī liào kàn le yī biàn。 dào le yǐ hòu， cái fā xiàn mín sù lí chē zhàn bǐ xiǎng de yuǎn。 hái hǎo lǎo bǎn yuàn yì lái jiē wǒ men。 wǒ men 〔3〕 dì èr tiān zài qù hú biān zǒu zǒu。", "source": "Đoạn mới biên soạn theo chủ đề và từ vựng của bài 11."}, {"id": "book-r11", "lesson": 12, "level": "B1", "title": "Một thay đổi nhỏ trong bữa ăn", "han": "室友最近開始吃素，我很好奇，就跟她去素食店吃飯。她說，吃素不一定每天只吃沙拉，也可以吃飯和豆腐。我以前常吃油膩的速食，現在想多吃青菜。對我來說，先改變一餐，比一下子改變所有習慣容易。", "pinyin": "shì yǒu zuì jìn kāi shǐ chī sù， wǒ hěn hào qí， jiù gēn tā qù sù shí diàn chī fàn。 tā shuō， chī sù bù yí dìng měi tiān zhǐ chī shā lā， yě kě yǐ chī fàn hé dòu fǔ。 wǒ yǐ qián cháng chī yóu nì de sù shí， xiàn zài xiǎng duō chī qīng cài。 duì wǒ lái shuō， xiān gǎi biàn yī cān， bǐ yī xià zi gǎi biàn suǒ yǒu xí guàn róng yì。", "vi": "Bạn cùng phòng gần đây ăn chay, tôi tò mò nên đi ăn cùng. Bạn nói ăn chay không phải chỉ ăn salad, vẫn có cơm và đậu. Trước tôi hay ăn đồ nhanh nhiều dầu, giờ muốn thêm rau. Với tôi đổi một bữa dễ hơn đổi toàn bộ thói quen.", "questions": [{"q": "室友說吃素可以吃什麼？", "pinyin": "shì yǒu shuō chī sù kě yǐ chī shén me？", "options": ["飯和豆腐", "只能吃沙拉", "只能喝水", "一定要吃肉"], "readings": {"飯和豆腐": "fàn hé dòu fǔ", "只能吃沙拉": "zhǐ néng chī shā lā", "只能喝水": "zhǐ néng hē shuǐ", "一定要吃肉": "yí dìng yào chī ròu"}, "answer": "飯和豆腐", "why": "Bạn cùng phòng nói có thể ăn cơm và đậu phụ."}, {"q": "他打算先改變多少？", "pinyin": "tā dǎ suàn xiān gǎi biàn duō shǎo？", "options": ["一餐", "所有習慣", "一個城市", "一份工作"], "readings": {"一餐": "yī cān", "所有習慣": "suǒ yǒu xí guàn", "一個城市": "yí gè chéng shì", "一份工作": "yī fèn gōng zuò"}, "answer": "一餐", "why": "Người kể muốn bắt đầu từ một bữa."}], "blanks": ["好奇", "青菜", "習慣"], "cloze": "室友最近開始吃素，我很〔1〕，就跟她去素食店吃飯。她說，吃素不一定每天只吃沙拉，也可以吃飯和豆腐。我以前常吃油膩的速食，現在想多吃〔2〕。對我來說，先改變一餐，比一下子改變所有〔3〕容易。", "clozePinyin": "shì yǒu zuì jìn kāi shǐ chī sù， wǒ hěn 〔1〕， jiù gēn tā qù sù shí diàn chī fàn。 tā shuō， chī sù bù yí dìng měi tiān zhǐ chī shā lā， yě kě yǐ chī fàn hé dòu fǔ。 wǒ yǐ qián cháng chī yóu nì de sù shí， xiàn zài xiǎng duō chī 〔2〕。 duì wǒ lái shuō， xiān gǎi biàn yī cān， bǐ yī xià zi gǎi biàn suǒ yǒu 〔3〕 róng yì。", "source": "Đoạn mới biên soạn theo chủ đề và từ vựng của bài 12."}, {"id": "book-r12", "lesson": 13, "level": "B1", "title": "Chiếc điện thoại thất lạc", "han": "下課以後，我發現手機不見了。我先用同學的手機打自己的號碼，可是沒有人接。後來我回教室找，才看見手機在桌子下面。原來它掉在地上了。找到以後，我立刻傳訊息給同學，請他不用再幫我找。", "pinyin": "xià kè yǐ hòu， wǒ fā xiàn shǒu jī bú jiàn le。 wǒ xiān yòng tóng xué de shǒu jī dǎ zì jǐ de hào mǎ， kě shì méi yǒu rén jiē。 hòu lái wǒ huí jiào shì zhǎo， cái kàn jiàn shǒu jī zài zhuō zi xià miàn。 yuán lái tā diào zài dì shàng le。 zhǎo dào yǐ hòu， wǒ lì kè chuán xùn xī gěi tóng xué， qǐng tā bù yòng zài bāng wǒ zhǎo。", "vi": "Tan học tôi phát hiện mất điện thoại. Tôi mượn máy bạn gọi số mình nhưng không ai nghe. Quay lại lớp mới thấy máy dưới bàn. Hóa ra nó rơi xuống đất. Tìm được rồi tôi nhắn ngay cho bạn để bạn khỏi tìm tiếp.", "questions": [{"q": "手機最後在哪裡？", "pinyin": "shǒu jī zuì hòu zài nǎ lǐ？", "options": ["桌子下面", "機場裡", "垃圾車上", "民宿門口"], "readings": {"桌子下面": "zhuō zi xià miàn", "機場裡": "jī chǎng lǐ", "垃圾車上": "lè sè chē shàng", "民宿門口": "mín sù mén kǒu"}, "answer": "桌子下面", "why": "Điện thoại nằm dưới bàn."}, {"q": "找到後，他做了什麼？", "pinyin": "zhǎo dào hòu， tā zuò le shén me？", "options": ["傳訊息給同學", "買新手機", "取消工作", "去看醫生"], "readings": {"傳訊息給同學": "chuán xùn xī gěi tóng xué", "買新手機": "mǎi xīn shǒu jī", "取消工作": "qǔ xiāo gōng zuò", "去看醫生": "qù kàn yī shēng"}, "answer": "傳訊息給同學", "why": "Người kể nhắn cho bạn ngay khi tìm được."}], "blanks": ["發現", "原來", "立刻"], "cloze": "下課以後，我〔1〕手機不見了。我先用同學的手機打自己的號碼，可是沒有人接。後來我回教室找，才看見手機在桌子下面。〔2〕它掉在地上了。找到以後，我〔3〕傳訊息給同學，請他不用再幫我找。", "clozePinyin": "xià kè yǐ hòu， wǒ 〔1〕 shǒu jī bú jiàn le。 wǒ xiān yòng tóng xué de shǒu jī dǎ zì jǐ de hào mǎ， kě shì méi yǒu rén jiē。 hòu lái wǒ huí jiào shì zhǎo， cái kàn jiàn shǒu jī zài zhuō zi xià miàn。〔2〕 tā diào zài dì shàng le。 zhǎo dào yǐ hòu， wǒ 〔3〕 chuán xùn xī gěi tóng xué， qǐng tā bù yòng zài bāng wǒ zhǎo。", "source": "Đoạn mới biên soạn theo chủ đề và từ vựng của bài 13."}, {"id": "book-r13", "lesson": 14, "level": "B1", "title": "Một kế hoạch sau tốt nghiệp", "han": "我明年就要畢業了。本來想馬上找工作，可是老師認為，我可以先想清楚自己的目標。我對翻譯有興趣，也希望繼續學中文。所以我打算先找一份相關的工作，再考慮要不要念研究所。", "pinyin": "wǒ míng nián jiù yào bì yè le。 běn lái xiǎng mǎ shàng zhǎo gōng zuò， kě shì lǎo shī rèn wéi， wǒ kě yǐ xiān xiǎng qīng chǔ zì jǐ de mù biāo。 wǒ duì fān yì yǒu xìng qù， yě xī wàng jì xù xué zhōng wén。 suǒ yǐ wǒ dǎ suàn xiān zhǎo yī fèn xiāng guān de gōng zuò， zài kǎo lǜ yào bù yào niàn yán jiū suǒ。", "vi": "Năm sau tôi sắp tốt nghiệp. Ban đầu định tìm việc ngay nhưng thầy khuyên xác định mục tiêu trước. Tôi thích phiên dịch và muốn học tiếng Trung tiếp. Vì vậy tôi định tìm việc liên quan rồi cân nhắc học cao học.", "questions": [{"q": "他對什麼有興趣？", "pinyin": "tā duì shén me yǒu xìng qù？", "options": ["翻譯", "修車", "做菜比賽", "開民宿"], "readings": {"翻譯": "fān yì", "修車": "xiū chē", "做菜比賽": "zuò cài bǐ sài", "開民宿": "kāi mín sù"}, "answer": "翻譯", "why": "Người kể nói mình thích phiên dịch."}, {"q": "他現在打算先做什麼？", "pinyin": "tā xiàn zài dǎ suàn xiān zuò shén me？", "options": ["找相關工作", "立刻退休", "放棄中文", "搬到國外"], "readings": {"找相關工作": "zhǎo xiāng guān gōng zuò", "立刻退休": "lì kè tuì xiū", "放棄中文": "fàng qì zhōng wén", "搬到國外": "bān dào guó wài"}, "answer": "找相關工作", "why": "Kế hoạch hiện tại là tìm việc liên quan trước."}], "blanks": ["畢業", "目標", "繼續"], "cloze": "我明年就要〔1〕了。本來想馬上找工作，可是老師認為，我可以先想清楚自己的〔2〕。我對翻譯有興趣，也希望〔3〕學中文。所以我打算先找一份相關的工作，再考慮要不要念研究所。", "clozePinyin": "wǒ míng nián jiù yào 〔1〕 le。 běn lái xiǎng mǎ shàng zhǎo gōng zuò， kě shì lǎo shī rèn wéi， wǒ kě yǐ xiān xiǎng qīng chǔ zì jǐ de 〔2〕。 wǒ duì fān yì yǒu xìng qù， yě xī wàng 〔3〕 xué zhōng wén。 suǒ yǐ wǒ dǎ suàn xiān zhǎo yī fèn xiāng guān de gōng zuò， zài kǎo lǜ yào bù yào niàn yán jiū suǒ。", "source": "Đoạn mới biên soạn theo chủ đề và từ vựng của bài 14."}, {"id": "book-r14", "lesson": 15, "level": "B1", "title": "Lần đầu đón Tết", "han": "今年我第一次在朋友家過年。除夕下午，全家一起打掃，門口貼上了春聯。晚上大家圍爐吃年夜飯。朋友的爸爸告訴我，吃魚有年年有餘的意思。飯後我們聊天，等到十二點再互相說新年快樂。", "pinyin": "jīn nián wǒ dì yī cì zài péng yǒu jiā guò nián。 chú xī xià wǔ， quán jiā yì qǐ dǎ sǎo， mén kǒu tiē shàng le chūn lián。 wǎn shàng dà jiā wéi lú chī nián yè fàn。 péng yǒu de bà bà gào sù wǒ， chī yú yǒu nián nián yǒu yú de yì si。 fàn hòu wǒ men liáo tiān， děng dào shí èr diǎn zài hù xiāng shuō xīn nián kuài lè。", "vi": "Năm nay tôi lần đầu đón Tết ở nhà bạn. Chiều giao thừa cả nhà dọn dẹp và dán câu đối. Tối mọi người sum họp ăn tất niên. Bố bạn giải thích ăn cá mang ý nghĩa năm nào cũng dư dả. Sau bữa ăn chúng tôi nói chuyện, chờ mười hai giờ chúc năm mới.", "questions": [{"q": "他們下午做什麼？", "pinyin": "tā men xià wǔ zuò shén me？", "options": ["打掃和貼春聯", "去看電腦展", "去面談", "泡溫泉"], "readings": {"打掃和貼春聯": "dǎ sǎo hé tiē chūn lián", "去看電腦展": "qù kàn diàn nǎo zhǎn", "去面談": "qù miàn tán", "泡溫泉": "pào wēn quán"}, "answer": "打掃和貼春聯", "why": "Chiều giao thừa gia đình dọn nhà và dán câu đối."}, {"q": "吃魚有什麼意思？", "pin 'use strict';
const $=(s)=>document.querySelector(s), main=$('#main');
const KEY='shiyu-mandarin-v1';
const defaults=()=>({version:1,words:{},days:{},stars:[],speaking:[],notes:{},pinyin:true,level:'all'});
let state=defaults();
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.version===1)state={...state,...saved};}catch{}
let route='home',topic='all',search='',wordFilter='all',wordSort='default',dialogueIndex=0,speakingIndex=0,session=null,timer=null,seconds=60,timerRunning=false;
const titles={home:'Hôm nay',vocab:'Từ vựng',practice:'Luyện tập',grammar:'Ngữ pháp',dialogues:'Hội thoại',speaking:'Luyện nói',reading:'Đọc đoạn văn',settings:'Cài đặt & tiến độ'};
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE');
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{toast('Không lưu được tiến độ. Hãy kiểm tra dung lượng hoặc chế độ riêng tư của trình duyệt.');}}
let toastTimeout;function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>$('#toast').style.display='none',4200);}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const allowed=x=>state.level==='all'||x.level===state.level;
const words=()=>DATA.vocab.filter(allowed);
const due=()=>words().filter(w=>state.words[w.id]&&state.words[w.id].due<=Date.now());
const learned=()=>words().filter(w=>state.words[w.id]);
const mastered=()=>learned().filter(w=>state.words[w.id].interval>=14&&state.words[w.id].reps>=3);
const badge=(l)=>`<span class="tag ${l==='B1'?'b1':''}">${esc(l)}</span>`;
const usageLabel = word => `<span class="tag usage-tag" title="Điểm ước tính cho giao tiếp hằng ngày ở Đài Loan">Thông dụng ${word.usage}%</span>`;
const py=(s)=>`<div class="pinyin">${esc(s)}</div>`;
function vocabularyExample(word) {
  if (!word.example) return `<button class="text-btn" data-action="open-reading" data-lesson="${word.lesson}">Đọc bài cùng chủ đề</button>`;
  return `<div class="example vocabulary-example"><div class="note">${esc(word.exampleLabel||'Ví dụ')}</div>
    <div lang="zh-Hant">${esc(word.example)}</div>
    ${py(word.examplePinyin)}
    <div class="example-vi" lang="vi">${esc(word.exampleVi)}</div>
  </div>`;
}
const audioButton=(text)=>`<button class="audio" data-action="audio" data-text="${esc(text)}" aria-label="Nghe ${esc(text)}">♪</button>`;
function dayLog(){const d=today();state.days[d]??={answers:0,correct:0};return state.days[d];}
function streak(){let d=new Date(),n=0;const key=x=>x.toLocaleDateString('sv-SE');if(!state.days[key(d)])d.setDate(d.getDate()-1);while(state.days[key(d)]){n++;d.setDate(d.getDate()-1);}return n;}
function activity(){dayLog();save();}
function updateWord(id,grade){const prev=state.words[id]||{interval:0,reps:0,lapses:0,due:0};let interval=grade===0?0:grade===1?1:prev.interval===0?1:Math.min(60,Math.max(3,Math.round(prev.interval*2.3)));state.words[id]={interval,reps:grade===0?0:prev.reps+1,lapses:prev.lapses+(grade===0?1:0),due:Date.now()+(grade===0?10*60000:interval*86400000)};save();}
function say(text,slow=false){if(!('speechSynthesis'in window)){toast('Trình duyệt này chưa hỗ trợ đọc. Bạn vẫn có thể học qua chữ và pinyin.');return;}const voices=speechSynthesis.getVoices();const voice=voices.find(v=>/zh[-_]TW/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang));if(!voice){toast('Chưa có giọng tiếng Trung trên thiết bị. Hãy cài giọng Mandarin trong cài đặt giọng nói của máy.');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=voice.lang;u.voice=voice;u.rate=slow?.65:.85;u.onerror=()=>toast('Không phát được giọng đọc. Hãy thử lại hoặc kiểm tra giọng nói trên thiết bị.');speechSynthesis.speak(u);}
if('speechSynthesis'in window)speechSynthesis.getVoices();
function navigate(r){if(!titles[r])r='home';if(timer){clearInterval(timer);timer=null;timerRunning=false;}if('speechSynthesis'in window)speechSynthesis.cancel();session=null;route=r;location.hash=r;render();window.scrollTo({top:0,behavior:'instant'});}
function render(){document.body.classList.toggle('no-pinyin',!state.pinyin);$('#pinyin-toggle').checked=state.pinyin;$('#global-level').value=state.level;document.querySelectorAll('[data-nav]').forEach(b=>{b.classList.toggle('active',b.dataset.nav===route);if(b.dataset.nav===route)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});$('#crumb').textContent=titles[route];$('#vocab-total').textContent=DATA.vocab.length;main.innerHTML=({home:homeView,vocab:vocabView,practice:practiceView,grammar:grammarView,dialogues:dialoguesView,speaking:speakingView,reading:readingView,settings:settingsView}[route])();}
const intro=(eyebrow,title,desc)=>`<div class="intro"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div></div>`;
function homeView(){const day=state.days[today()]||{answers:0,correct:0};const w=words()[Math.floor(Date.now()/86400000)%words().length];return `<div class="intro"><div><div class="eyebrow">CHÀO BẠN · 你好</div><h1>Mỗi ngày, gần tiếng Trung hơn.</h1><p>Từ những điều nhỏ hôm nay, đến những cuộc trò chuyện tự tin hơn.</p></div><span class="date-chip">${new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'long'})}</span></div>
<section class="hero"><div class="hero-copy"><div class="eyebrow">LỘ TRÌNH A2 – B1 · TIẾNG TRUNG ĐÀI LOAN</div><h2>Học một chút.<br>Dùng được nhiều hơn.</h2><p>Ôn từ, nghe một câu, nói thành lời.<br>Buổi học 10 phút của bạn bắt đầu từ đây.</p><button class="btn light" data-action="start" data-mode="daily">Bắt đầu buổi học hôm nay <span>✦</span></button></div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="art-char">語<small>yǔ<br>ngôn ngữ</small></div><div class="art-stamp">每天進步一點</div></div></section>
<div class="stats"><div class="stat"><div class="stat-top">Mục tiêu hôm nay <span class="stat-icon">◴</span></div><strong>${Math.min(day.answers,20)}<small>/ 20 câu</small></strong><progress max="20" value="${Math.min(day.answers,20)}" aria-label="Mục tiêu hôm nay"></progress></div><div class="stat"><div class="stat-top">Chuỗi ngày học <span class="stat-icon">✧</span></div><strong>${streak()}<small>ngày liên tiếp</small></strong></div><div class="stat"><div class="stat-top">Đã bắt đầu học <span class="stat-icon">▤</span></div><strong>${learned().length}<small>/ ${words().length} từ</small></strong></div><div class="stat"><div class="stat-top">Đến lúc ôn lại <span class="stat-icon">⟳</span></div><strong>${due().length}<small>từ đang chờ bạn</small></strong></div></div>
<div class="columns"><section><div class="section-head"><h2>Một chút mỗi ngày</h2><span class="note">Dành cho bạn</span></div><div class="card"><div class="lesson-row"><div class="lesson-icon">詞</div><div><h3>Ôn từ, nhớ lâu hơn</h3><p>Flashcard · Lịch ôn theo mức độ nhớ</p></div><button class="btn small soft" data-action="start" data-mode="flash">Học từ</button></div><div class="lesson-row"><div class="lesson-icon">聽</div><div><h3>Nghe những câu quen thuộc</h3><p>Hội thoại · Tình huống tại Đài Loan</p></div><button class="btn small secondary" data-nav="dialogues">Luyện nghe</button></div><div class="lesson-row"><div class="lesson-icon">說</div><div><h3>Biến ý nghĩ thành lời nói</h3><p>Chủ đề ngắn · Nói trong 60 giây</p></div><button class="btn small secondary" data-nav="speaking">Luyện nói</button></div></div></section><section><div class="section-head"><h2>Từ của hôm nay</h2><button class="text-btn" data-nav="vocab">Khám phá từ vựng</button></div><div class="card word-day"><div class="card-meta">${badge(w.level)}${usageLabel(w)}<span class="note">${esc(w.topic)}</span></div><div class="han" lang="zh-Hant">${esc(w.han)}</div>${py(w.pinyin)}<p class="meaning">${esc(w.vi)}</p>${vocabularyExample(w)}${audioButton(w.han)}</div></section></div>
<section class="space-top"><div class="section-head"><h2>Tiếng Trung quanh bạn</h2><span class="note">15 chủ đề theo sách</span></div><div class="topic-grid">${DATA.topics.map(x=>[x.title,String(x.lesson)]).map(([t,c])=>`<button class="topic" data-action="topic" data-topic="${t}"><span class="topic-char" lang="zh-Hant">${c}</span><strong>${t}</strong><small>${words().filter(w=>w.topic===t).length} từ · ${learned().filter(w=>w.topic===t).length} đã học</small></button>`).join('')}</div></section>`;}
function visibleWords(){const matches=words().filter(w=>(topic==='all'||w.topic===topic)&&(wordFilter!=='star'||state.stars.includes(w.id))&&(wordFilter!=='due'||state.words[w.id]?.due<=Date.now())&&(wordFilter!=='new'||!state.words[w.id])&&normalize([w.han,w.pinyin,w.vi].join(' ')).includes(normalize(search)));
  return wordSort === 'usage' ? matches.sort((a, b) => b.usage - a.usage) : matches;
}
function vocabCards(){const ws=visibleWords();return ws.length?ws.map(w=>`<article class="card vocab-card"><div class="card-meta vocab-meta">${badge(w.level)}${usageLabel(w)}${audioButton(w.han)}</div><div class="han" lang="zh-Hant">${esc(w.han)}</div>${py(w.pinyin)}<p>${esc(w.vi)}</p>${vocabularyExample(w)}<div class="meta-bottom"><span>${w.source==='pdf'?'Sách · Bài '+w.lesson:'Mở rộng · Bài '+w.lesson} · ${esc(w.topic)} · ${state.words[w.id]?(state.words[w.id].due<=Date.now()?'Đến lịch ôn':`Ôn lại ${new Date(state.words[w.id].due).toLocaleDateString('vi-VN')}`):'Từ mới'}</span><button class="star" data-action="star" data-id="${w.id}" aria-label="${state.stars.includes(w.id)?'Bỏ lưu':'Lưu'} ${w.han}" aria-pressed="${state.stars.includes(w.id)}">${state.stars.includes(w.id)?'★':'☆'}</button></div></article>`).join(''):'<div class="card empty">Không có từ phù hợp. Thử đổi chủ đề hoặc bộ lọc nhé.</div>';}
function vocabView(){return intro('TÍCH LŨY MỖI NGÀY','Những từ bạn sẽ dùng thật.','Từ và cụm từ theo 15 bài của Đương đại Trung văn 2, kèm từ mở rộng trong đời sống.')+`<div class="toolbar"><input class="search" id="search" aria-label="Tìm từ" placeholder="Tìm chữ Hán, pinyin hoặc nghĩa tiếng Việt…" value="${esc(search)}"><select id="topic-select" aria-label="Chủ đề"><option value="all">Tất cả chủ đề</option>${[...new Set(DATA.vocab.map(w=>w.topic))].map(t=>`<option ${t===topic?'selected':''}>${t}</option>`).join('')}</select><select id="word-sort" aria-label="Sắp xếp từ vựng"><option value="default">Thứ tự mặc định</option><option value="usage" ${wordSort==='usage'?'selected':''}>Thông dụng nhất</option></select><button class="btn" data-action="start" data-mode="vocab-flash">Học bộ từ này</button></div><p class="note">Độ thông dụng là điểm ước tính trên thang 0–100% cho giao tiếp hằng ngày ở Đài Loan. Điểm cao hơn nghĩa là nên học sớm hơn. Điểm này không dựa trên số liệu tần suất thực tế.</p><div class="section-head"><div class="filters">${[['all','Tất cả'],['new','Chưa học'],['due','Cần ôn'],['star','Đã lưu']].map(([v,t])=>`<button class="filter ${wordFilter===v?'active':''}" data-action="filter" data-value="${v}">${t}</button>`).join('')}</div><span class="note" id="word-count">${visibleWords().length} từ</span></div>${topicExtensions()}<div class="vocab-grid" id="vocab-list">${vocabCards()}</div><p class="note space-top">Nhãn A2/B1 là mức học gợi ý cho nội dung này, không phải phân loại TOCFL chính thức của từng từ.</p>`;}
function practiceView(){if(session)return quizView();return intro('NHỚ BẰNG CÁCH SỬ DỤNG','Một lần luyện, một chút tiến bộ.','Chọn cách luyện. Mỗi lượt có tối đa 10 câu, có đáp án và giải thích.')+`<div class="practice-layout"><div class="mode-grid"><button class="mode-card" data-nav="reading"><span class="mode-glyph">讀</span><h3>Đọc đoạn văn</h3><p>15 đoạn · Điền từ và trắc nghiệm · Giải thích đáp án</p><span class="tag">Theo 15 bài trong sách</span></button>${[['meaning','詞','Chọn nghĩa đúng','Nhìn chữ Hán, nhớ nghĩa tiếng Việt.'],['listening','聽','Nghe và nhận biết','Nghe từ rồi chọn nghĩa, chưa hiện chữ Hán.'],['typing','寫','Gõ lại từ vựng','Từ nghĩa tiếng Việt, gõ chữ Hán hoặc pinyin.'],['order','句','Xếp câu tự nhiên','Sắp xếp các cụm từ thành câu đúng.'],['grammar','文','Điền mẫu ngữ pháp','Chọn từ nối và cấu trúc phù hợp.'],['flash','記','Flashcard chủ động','Tự nhớ trước khi mở mặt sau.']].map(([m,c,t,d])=>`<button class="mode-card" data-action="start" data-mode="${m}"><span class="mode-glyph">${c}</span><h3>${t}</h3><p>${d}</p><span class="tag">${m==='grammar'?`${DATA.grammar.filter(allowed).length} mẫu`:m==='order'?'12 câu':`${words().length} từ`} · Lọc theo trình độ</span></button>`).join('')}</div><aside><div class="card review-panel"><h3>Gặp lại đúng lúc</h3><strong>${due().length}</strong><p>từ đến lịch ôn. Từ chưa nhớ sẽ quay lại sau 10 phút.</p><button class="btn light space-top" data-action="start" data-mode="review">Ôn từ đến hạn</button></div><div class="card space-top"><h3>Nhớ lâu hơn</h3><p class="note">Tự nhớ đáp án trước khi xem. Đọc ví dụ thành tiếng. Sau đó tự đặt một câu về cuộc sống của bạn.</p><p class="note">Giọng đọc dùng tính năng trên thiết bị; cần có giọng Mandarin. Tiến độ lưu trong trình duyệt này.</p></div></aside></div>`;}
function normalize(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/đ/g,'d').replace(/[\s，。！？、,.!?;：:「」“”]/g,'');}
function wordQuestion(w,mode){const type=mode==='daily'?shuffle(['meaning','typing','meaning'])[0]:mode;return {type,w,answer:w.vi,options:shuffle([w.vi,...shuffle(DATA.vocab.filter(x=>x.vi!==w.vi)).slice(0,3).map(x=>x.vi)])};}
function start(mode){let pool=words(),kind=mode;if(mode==='review')pool=due();if(mode==='vocab-flash'){pool=visibleWords();kind='flash';}if(mode==='flash'||mode==='daily'){const reviews=shuffle(due());const fresh=shuffle(words().filter(w=>!state.words[w.id]));const other=shuffle(words().filter(w=>state.words[w.id]&&!reviews.some(x=>x.id===w.id)));pool=[...reviews,...fresh,...other];}else pool=shuffle(pool);let qs;if(mode==='grammar')qs=shuffle(DATA.grammar.filter(allowed)).slice(0,10).map(g=>({type:'grammar',g,answer:g.answer,options:shuffle(g.options)}));else if(mode==='order')qs=shuffle(DATA.orders.filter(x=>state.level==='all'||x[0]===state.level)).slice(0,10).map(o=>({type:'order',order:o,tokens:shuffle(o[2].map((t,i)=>({t,i}))),picked:[]}));else qs=pool.slice(0,10).map(w=>wordQuestion(w,kind==='review'?'flash':kind));if(!qs.length){toast(mode==='review'?'Chưa có từ đến lịch ôn. Bạn có thể học từ mới bằng Flashcard.':'Không có nội dung phù hợp với bộ lọc.');return;}session={mode,qs,index:0,correct:0,answered:false,revealed:false,mistakes:[]};route='practice';location.hash='practice';render();window.scrollTo({top:0,behavior:'instant'});}
function quizView(){const s=session;if(s.index>=s.qs.length)return resultView();const q=s.qs[s.index];let body='';if(['meaning','typing','listening','flash'].includes(q.type)){const w=q.w;body=`<div class="card-meta quiz-vocab-meta">${badge(w.level)}${usageLabel(w)}<span class="note">${esc(w.topic)}</span></div>`;if(q.type==='listening')body+=`<div class="flash-front"><p>Nghe từ và chọn nghĩa phù hợp.</p><button class="btn" data-action="listen">♪ Nghe từ</button> <button class="btn secondary" data-action="listen-slow">Nghe chậm</button><p class="note space-top">Cần giọng Mandarin trên thiết bị. Có thể chọn chế độ khác nếu chưa có giọng đọc.</p></div>`;else if(q.type==='typing')body+=`<div class="flash-front"><p>Viết từ tiếng Trung có nghĩa:</p><h2>${esc(w.vi)}</h2><p class="note">Gõ chữ Hán hoặc pinyin có/không dấu. Bài này không chấm thanh điệu.</p></div><input class="typing" id="typed-answer" aria-label="Câu trả lời" autocomplete="off" placeholder="Nhập từ tại đây…">`;else body+=`<div class="quiz-han" lang="zh-Hant">${esc(w.han)}</div>${py(w.pinyin)}<div style="text-align:center">${audioButton(w.han)}</div>`;if(q.type==='flash'){body+=s.revealed?`<div class="flash-front"><div class="meaning">${esc(w.vi)}</div>${vocabularyExample(w)}${(w.example?audioButton(w.example):'')}</div><p class="note">Chọn theo mức độ bạn đã nhớ trước khi mở đáp án.</p><div class="flash-actions"><button class="btn secondary" data-action="grade" data-grade="0">Chưa nhớ · 10 phút</button><button class="btn secondary" data-action="grade" data-grade="1">Hơi khó · 1 ngày</button><button class="btn" data-action="grade" data-grade="2">Đã nhớ</button></div>`:`<div class="flash-front"><p class="note">Tự nói nghĩa trước khi mở mặt sau.</p><button class="btn" data-action="reveal">Hiện đáp án</button></div>`;}else if(q.type!=='typing')body+=answers(q.options);}else if(q.type==='grammar'){body=`${badge(q.g.level)}<p class="quiz-prompt space-top">Chọn từ thích hợp để hoàn thành câu.</p><div class="quiz-han" lang="zh-Hant">${esc(q.g.q)}</div>${py(q.g.questionPinyin)}${answers(q.options,q.g.optionPinyin)}`;}else if(q.type==='order'){body=`${badge(q.order[0])}<p class="quiz-prompt space-top">Sắp xếp câu: ${esc(q.order[1])}</p><div class="token-answer" aria-label="Câu đã xếp">${q.picked.length?q.picked.map(i=>`<button class="token" data-action="unpick" data-index="${i}" ${s.answered?'disabled':''}>${esc(q.order[2][i])}</button>`).join(''):'<span class="note">Chọn các cụm từ ở bên dưới…</span>'}</div><div class="token-bank">${q.tokens.filter(x=>!q.picked.includes(x.i)).map(x=>`<button class="token" data-action="pick" data-index="${x.i}" ${s.answered?'disabled':''}>${esc(x.t)}</button>`).join('')}</div>`;}
return `<div class="quiz"><div class="quiz-top"><button class="text-btn" data-action="quit">Đóng buổi luyện</button><span class="note">Câu ${s.index+1} / ${s.qs.length}</span></div><div class="progress-track"><div class="progress-fill" style="width:${100*s.index/s.qs.length}%"></div></div><div class="card">${body}<div id="feedback" aria-live="polite"></div>${q.type==='flash'?'':`<div class="quiz-actions"><span class="note">${s.correct} câu đúng</span>${['typing','order'].includes(q.type)?'<button class="btn" id="check-btn" data-action="check">Kiểm tra</button>':''}<button class="btn hidden" id="next-btn" data-action="next">Câu tiếp theo</button></div>`}</div></div>`;}
function answers(opts, readings){return `<div class="answers">${opts.map((a,i)=>`<button class="answer" data-action="answer" data-index="${i}">${esc(a)}${readings?py(readings[a]):''}</button>`).join('')}</div>`;}
function recordAnswer(correct,q,trackWord=true){dayLog().answers++;if(correct){dayLog().correct++;session.correct++;}else session.mistakes.push(q);if(q.w&&trackWord)updateWord(q.w.id,correct?2:0);save();}
function check(selected){const s=session;if(!s||s.answered)return;const q=s.qs[s.index];let correct=false,expected='';if(q.type==='order'){if(q.picked.length!==q.order[2].length){toast('Hãy chọn đủ các cụm từ trước khi kiểm tra.');return;}correct=q.picked.every((x,i)=>x===i);expected=q.order[2].join('');}else if(q.type==='typing'){const v=$('#typed-answer').value.trim();if(!v){toast('Hãy nhập câu trả lời trước nhé.');return;}correct=[q.w.han,q.w.pinyin].some(x=>normalize(x)===normalize(v));expected=q.w.han+' · '+q.w.pinyin+' · '+q.w.vi;$('#typed-answer').disabled=true;}else{correct=selected===q.answer;expected=q.type==='grammar'?q.g.answer:q.w.han+' · '+q.w.pinyin+' · '+q.w.vi;document.querySelectorAll('.answers .answer').forEach(b=>{b.disabled=true;if(q.options[Number(b.dataset.index)]===q.answer)b.classList.add('correct');else if(q.options[Number(b.dataset.index)]===selected)b.classList.add('wrong');});}s.answered=true;recordAnswer(correct,q);const explanation=q.type==='grammar'?q.g.why:'Đặt chủ ngữ và các thành phần theo đúng trật tự của câu mẫu.';$('#feedback').innerHTML=`<div class="feedback ${correct?'':'bad'}"><strong>${correct?'Bạn nhớ đúng rồi!':'Chưa đúng. Mình cùng nhớ lại nhé.'}</strong><div lang="zh-Hant">${esc(expected)}</div>${q.g?py(q.g.optionPinyin[q.g.answer]):''}${q.w?vocabularyExample(q.w)+(q.w.example?audioButton(q.w.example):''):`<p style="margin:8px 0 0">${esc(explanation)}</p>`}</div>`;if($('#check-btn'))$('#check-btn').classList.add('hidden');$('#next-btn').classList.remove('hidden');$('#next-btn').focus();}
function next(){if(!session?.answered)return;session.index++;session.answered=false;session.revealed=false;main.innerHTML=quizView();}
function resultView(){const s=session;return `<div class="quiz result"><div class="card"><div class="eyebrow">MỘT BƯỚC TIẾN HÔM NAY</div><h1>Bạn đã hoàn thành!</h1><div class="big-score">${s.correct}<span style="font-size:30px;color:var(--muted)"> / ${s.qs.length}</span></div><p>${s.mode==='flash'||s.mode==='review'||s.mode==='vocab-flash'?'Số từ bạn tự đánh giá đã nhớ.':'Số câu trả lời đúng.'} Tiến độ đã được lưu trên thiết bị này.</p>${s.mistakes.length?`<p class="note">${s.mistakes.length} câu cần luyện thêm. Các từ chưa nhớ sẽ đến lịch ôn sau 10 phút.</p><button class="btn" data-action="retry">Luyện lại câu chưa nhớ</button>`:'<p>Bạn đang làm rất tốt. Thử đặt một câu của riêng mình nhé.</p>'}<div class="button-row" style="justify-content:center;margin-top:20px"><button class="btn secondary" data-nav="home">Về hôm nay</button><button class="btn secondary" data-nav="practice">Chọn bài luyện khác</button></div></div></div>`;}
function grammarView(){return intro('HIỂU MẪU · DÙNG ĐƯỢC CÂU','Ngữ pháp vừa đủ để nói.','15 cấu trúc gắn với 15 bài trong sách. Đọc mẫu, nghe ví dụ, rồi luyện điền từ.')+`<div class="toolbar"><button class="btn" data-action="start" data-mode="grammar">Luyện ngữ pháp</button><span class="note">${DATA.grammar.filter(allowed).length} cấu trúc phù hợp</span></div><div class="grammar-grid">${DATA.grammar.filter(allowed).map(g=>`<article class="card grammar-card"><div class="card-meta">${badge(g.level)}${audioButton(g.example)}</div><h3 lang="zh-Hant">${esc(g.title)}</h3>${py(g.titlePinyin)}<p>${esc(g.note)}</p><div class="example-box"><div lang="zh-Hant">${esc(g.example)}</div>${py(g.pinyin)}<p>${esc(g.vi)}</p></div></article>`).join('')}</div>`;}

ng đọc dùng Speech Synthesis của trình duyệt, ưu tiên zh-TW. Bạn cần cài giọng Mandarin trên thiết bị; giọng có thể phụ thuộc hệ điều hành và kết nối mạng.</p></div><div class="card"><h3>Bắt đầu lại</h3><p>Xóa tiến độ học trên trình duyệt này. Hãy xuất bản sao trước nếu bạn muốn giữ lại.</p><button class="btn secondary" data-action="reset-data">Xóa tiến độ</button></div></div>`;}

function validateImport(s){s=migrateBookProgress(s);if(!s||s.version!==1||!s.words||typeof s.words!=='object'||Array.isArray(s.words)||!s.days||typeof s.days!=='object'||Array.isArray(s.days)||!Array.isArray(s.stars)||!Array.isArray(s.speaking)||!s.notes||typeof s.notes!=='object'||Array.isArray(s.notes)||typeof s.pinyin!=='boolean'||!['A2','B1','all'].includes(s.level))throw Error();const clean=defaults();for(const [id,w]of Object.entries(s.words)){if(!DATA.vocab.some(x=>x.id===id)||!w||!['interval','reps','lapses','due'].every(k=>Number.isFinite(w[k])&&w[k]>=0)||w.interval>60||!Number.isInteger(w.reps)||!Number.isInteger(w.lapses))throw Error();clean.words[id]={interval:w.interval,reps:w.reps,lapses:w.lapses,due:w.due};}for(const [d,x]of Object.entries(s.days)){if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!x||!Number.isInteger(x.answers)||!Number.isInteger(x.correct)||x.answers<0||x.correct<0||x.correct>x.answers)throw Error();clean.days[d]={answers:x.answers,correct:x.correct};}clean.stars=[...new Set(s.stars.filter(id=>DATA.vocab.some(w=>w.id===id)))];clean.speaking=[...new Set(s.speaking.filter(i=>Number.isInteger(i)&&DATA.speaking[i]))];for(const [k,v]of Object.entries(s.notes)){if(!/^\d+$/.test(k)||!DATA.speaking[Number(k)]||typeof v!=='string'||v.length>20000)throw Error();clean.notes[k]=v;}clean.level=s.level;clean.pinyin=s.pinyin;return clean;}

ak;}case'dialogue':dialogueIndex=Number(b.dataset.index);render();break;case'translation':document.querySelectorAll('.translation').forEach(p=>p.classList.toggle('hidden'));break;case'dialogue-answer':{const d=DATA.dialogues[dialogueIndex];document.querySelectorAll('.dialogue-question .answer').forEach(el=>{el.disabled=true;if(el.dataset.value===d.answer)el.classList.add('correct');else if(el===b)el.classList.add('wrong');});const correct=b.dataset.value===d.answer;dayLog().answers++;if(correct)dayLog().correct++;save();$('#dialogue-feedback').innerHTML=`<div class="feedback ${correct?'':'bad'}">${correct?'Đúng rồi!':'Đáp án: '+esc(d.answer)}<p style="margin:8px 0 0">Đọc lại hội thoại và thử nói vai “你” nhé.</p></div>`;break;}case'speaking':resetTimer();speakingIndex=Number(b.dataset.index);render();break;case'timer':toggleTimer();break;case'reset-timer':resetTimer();break;case'complete-speaking':if(document.querySelectorAll('.selfcheck:checked').length<3){toast('Hãy tự kiểm tra cả ba mục sau khi luyện nói nhé.');return;}if(!state.speaking.includes(speakingIndex))state.speaking.push(speakingIndex);activity();resetTimer();render();toast('Đã lưu buổi luyện nói. Hẹn bạn một chủ đề mới!');break;case'export':exportProgress();break;case'import':$('#import-file').click();break;case'reset-data':if(confirm('Xóa toàn bộ tiến độ Shíyǔ trên trình duyệt này? Bạn có thể xuất file sao lưu trước.')){state=defaults();save();render();toast('Đã đặt lại tiến độ.');}break;}});

function migrateBookProgress(progress) {
  if (!progress || typeof progress !== 'object' || !progress.words || !Array.isArray(progress.stars)) return progress;
  const known = new Set(DATA.vocab.map(word => word.id));
  const mapId = id => known.has(id) ? id : DATA.vocab.find(word => word.han === DATA.previousWords[id])?.id;
  const words = {};
  for (const [id, value] of Object.entries(progress.words)) {
    const replacement = mapId(id);
    if (replacement) words[replacement] = value;
  }
  return {...progress, words, stars: [...new Set(progress.stars.map(mapId).filter(Boolean))]};
}

  // Fixed options for an attempt prevent answer choices from changing during grading.

    passage.questions.forEach(question => { question.shuffled = shuffle(question.options); });

    `<div class="dialogue-tabs">${list.map(r => `<button class="filter ${r===passage?'active':''}" data-action="reading-select" data-index="${DATA.readings.indexOf(r)}">Bài ${r.lesson} · ${esc(r.title)}</button>`).join('')}</div>

      <p lang="zh-Hant" class="passage-han">${esc(passage.han)}</p>

      <p class="note space-top">${esc(passage.source)} Các đoạn và câu hỏi được biên soạn mới cho ứng dụng.</p>

      <h2>Trắc nghiệm đọc hiểu</h2>
      ${passage.questions.map((question,i)=>`<fieldset><legend><span lang="zh-Hant">${i+1}. ${esc(question.q)}</span>${py(question.pinyin)}</legend>
        ${question.shuffled.map((answer,j)=>`<label class="reading-option"><input type="radio" name="read-q${i}" value="${j}"><span lang="zh-Hant">${esc(answer)}${py(question.readings[answer])}</span></label>`).join('')}</fieldset>`).join('')}

      <div id="reading-feedback" role="status" aria-live="polite"></div>

function checkReading() {
  if (readingResult) return;
  const passage = DATA.readings[readingIndex];
  const chosen = passage.questions.map((q,i)=>document.querySelector(`input[name="read-q${i}"]:checked`));
  const cloze = passage.blanks.map((answer,i)=>document.querySelector('#cloze-'+i).value);
  if (chosen.some(x=>!x) || cloze.some(x=>!x)) {
    toast('Hãy trả lời đủ 2 câu trắc nghiệm và 3 chỗ trống nhé.');
    return;
  }
  const outcomes = passage.questions.map((q,i)=>({
    correct:q.shuffled[Number(chosen[i].value)]===q.answer,
    answer:q.answer, why:q.why, pinyin:q.readings[q.answer]
  })).concat(passage.blanks.map((answer,i)=>({
    correct:cloze[i]===answer,answer,
    why:'Đối chiếu chỗ '+(i+1)+' với câu đầy đủ ở đoạn đọc phía trên.',
    pinyin:DATA.vocab.find(w=>w.han===answer)?.pinyin||''
  })));
  const score = outcomes.filter(x=>x.correct).length;
  readingResult = {score};
  dayLog().answers += 5;
  dayLog().correct += score;
  save();
  document.querySelectorAll('.reading-exercises input, .reading-exercises select').forEach(input=>input.disabled=true);
  document.querySelector('#reading-check-btn').disabled = true;
  document.querySelector('#reading-feedback').innerHTML = `<div class="feedback"><strong>Bạn đúng ${score}/5 câu</strong></div>
    ${outcomes.map((result,i)=>`<div class="feedback ${result.correct?'':'bad'}">
      <strong>${i<2?'Trắc nghiệm '+(i+1):'Điền từ '+(i-1)} · ${result.correct?'Đúng':'Cần xem lại'}</strong>
      <div lang="zh-Hant">${esc(result.answer)}</div>${py(result.pinyin)}<p>${esc(result.why)}</p></div>`).join('')}`;
}

state=migrateBookProgress(state);save();
route=titles[location.hash.slice(1)]?location.hash.slice(1):'home';render();
</script></body></html>
