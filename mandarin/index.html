 "我去過台南。", "pinyin": "Wǒ qù guò Táinán.", "vi": "Tôi từng đến Đài Nam.", "target": "過", "q": "我沒吃___這道菜。", "options": ["過", "著", "的", "得"], "answer": "過", "why": "沒 + động từ + 過 diễn tả chưa từng có trải nghiệm."}, {"id": "g5", "level": "A2", "title": "一邊…一邊…", "note": "Hai hành động xảy ra cùng lúc, thường do cùng một chủ thể thực hiện.", "example": "我一邊走路，一邊聽音樂。", "pinyin": "Wǒ yìbiān zǒu lù, yìbiān tīng yīnyuè.", "vi": "Tôi vừa đi bộ vừa nghe nhạc.", "target": "一邊", "q": "他一邊做飯，___聽廣播。", "options": ["一邊", "所以", "才", "雖然"], "answer": "一邊", "why": "Hai hành động đồng thời dùng 一邊…一邊…."}, {"id": "g6", "level": "B1", "title": "雖然…但是…", "note": "Hai vế có quan hệ nhượng bộ, trái với điều thường mong đợi.", "example": "雖然很累，但是我還想練習。", "pinyin": "Suīrán hěn lèi, dànshì wǒ hái xiǎng liànxí.", "vi": "Dù rất mệt nhưng tôi vẫn muốn luyện tập.", "target": "雖然", "q": "___下雨，但是我們還是出門了。", "options": ["雖然", "因為", "如果", "只要"], "answer": "雖然", "why": "下雨 và vẫn ra ngoài tạo quan hệ nhượng bộ."}, {"id": "g7", "level": "B1", "title": "如果…就…", "note": "Một điều kiện giả định và kết quả khi điều kiện đó xảy ra.", "example": "如果明天有空，我就去。", "pinyin": "Rúguǒ míngtiān yǒu kòng, wǒ jiù qù.", "vi": "Nếu mai rảnh thì tôi sẽ đi.", "target": "如果", "q": "___你有問題，就問我。", "options": ["如果", "雖然", "不但", "除了"], "answer": "如果", "why": "如果 mở đầu điều kiện; 就 dẫn kết quả."}, {"id": "g8", "level": "B1", "title": "不但…而且…", "note": "Bổ sung ý với mức độ tăng thêm: không những… mà còn…", "example": "這家店不但便宜，而且好吃。", "pinyin": "Zhè jiā diàn bùdàn piányí, érqiě hǎo chī.", "vi": "Quán này không những rẻ mà còn ngon.", "target": "而且", "q": "他不但會說中文，___會說日文。", "options": ["而且", "可是", "所以", "或者"], "answer": "而且", "why": "不但 thường kết hợp với 而且 để bổ sung ý."}, {"id": "g9", "level": "B1", "title": "越來越…", "note": "Một đặc điểm thay đổi theo thời gian: ngày càng…", "example": "我的中文越來越流利。", "pinyin": "Wǒ de Zhōngwén yuè lái yuè liúlì.", "vi": "Tiếng Trung của tôi ngày càng lưu loát.", "target": "越來越", "q": "練習了一個月，我說得___自然。", "options": ["越來越", "一邊", "只要", "除了"], "answer": "越來越", "why": "越來越 diễn tả mức độ tăng dần theo thời gian."}, {"id": "g10", "level": "B1", "title": "把", "note": "Chủ ngữ + 把 + tân ngữ xác định + động từ + kết quả/hướng/nơi đến.", "example": "請把資料寄給我。", "pinyin": "Qǐng bǎ zīliào jì gěi wǒ.", "vi": "Hãy gửi tài liệu cho tôi.", "target": "把", "q": "請___門關好。", "options": ["把", "比", "跟", "向"], "answer": "把", "why": "把 đưa đối tượng 門 lên trước hành động và kết quả 關好."}, {"id": "g11", "level": "B1", "title": "除了…以外，還…", "note": "Bổ sung một điều bên cạnh điều đã nêu. Chú ý 還 để phân biệt với nghĩa loại trừ.", "example": "除了中文以外，我還想學日文。", "pinyin": "Chúle Zhōngwén yǐwài, wǒ hái xiǎng xué Rìwén.", "vi": "Ngoài tiếng Trung tôi còn muốn học tiếng Nhật.", "target": "還", "q": "除了咖啡以外，我___喜歡喝茶。", "options": ["還", "才", "卻", "只"], "answer": "還", "why": "還 cho biết trà được thêm vào cà phê, không phải bị loại trừ."}], "dialogues": [{"title": "Một ly cà phê mang đi", "level": "A2", "topic": "Ăn uống", "lines": [["店員", "您好，請問要喝什麼？", "Nín hǎo, qǐngwèn yào hē shénme?", "Chào bạn, bạn muốn uống gì?"], ["你", "我要一杯大杯冰美式，謝謝。", "Wǒ yào yì bēi dà bēi bīng Měishì, xièxie.", "Cho tôi một Americano đá cỡ lớn, cảm ơn."], ["店員", "請問內用還是外帶？", "Qǐngwèn nèi yòng háishì wài dài?", "Bạn dùng tại quán hay mang đi?"], ["你", "外帶，麻煩幫我做少冰。", "Wài dài, máfan bāng wǒ zuò shǎo bīng.", "Mang đi, phiền bạn cho ít đá."]], "q": "Khách muốn uống tại đâu?", "options": ["Mang đi", "Tại quán", "Ở sân ga", "Chưa quyết định"], "answer": "Mang đi"}, {"title": "Hỏi đường ở ga MRT", "level": "A2", "topic": "Đi lại", "lines": [["你", "不好意思，去台北車站要轉車嗎？", "Bù hǎo yìsi, qù Táiběi Chēzhàn yào zhuǎn chē ma?", "Xin lỗi, đi ga Đài Bắc có cần chuyển tàu không?"], ["路人", "要，請在下一站轉紅線。", "Yào, qǐng zài xià yí zhàn zhuǎn hóng xiàn.", "Có, hãy chuyển sang tuyến đỏ ở ga tiếp theo."], ["你", "大概要多久？", "Dàgài yào duō jiǔ?", "Khoảng bao lâu?"], ["路人", "大概二十分鐘。", "Dàgài èrshí fēnzhōng.", "Khoảng hai mươi phút."]], "q": "Cần chuyển tàu ở đâu?", "options": ["Ga tiếp theo", "Ga cuối", "Không cần chuyển", "Ga trước đó"], "answer": "Ga tiếp theo"}, {"title": "Mua đồ ở cửa hàng", "level": "A2", "topic": "Mua sắm", "lines": [["店員", "一共兩百五十元。", "Yígòng liǎng bǎi wǔ shí yuán.", "Tổng cộng 250 Đài tệ."], ["你", "可以刷卡嗎？", "Kěyǐ shuā kǎ ma?", "Có thể thanh toán bằng thẻ không?"], ["店員", "可以，請問有載具嗎？", "Kěyǐ, qǐngwèn yǒu zài jù ma?", "Được, bạn có mã lưu hóa đơn điện tử không?"], ["你", "有，請幫我刷這個條碼。", "Yǒu, qǐng bāng wǒ shuā zhège tiáomǎ.", "Có, hãy quét mã vạch này giúp tôi."]], "q": "載具 ở đây dùng để làm gì?", "options": ["Lưu hóa đơn điện tử", "Nạp thẻ MRT", "Đổi tiền", "Đặt bàn"], "answer": "Lưu hóa đơn điện tử"}, {"title": "Trao đổi tiến độ công việc", "level": "B1", "topic": "Công việc", "lines": [["主管", "這份資料今天能完成嗎？", "Zhè fèn zīliào jīntiān néng wánchéng ma?", "Tài liệu này hôm nay có thể hoàn thành không?"], ["你", "大部分已經完成了，不過還需要確認幾個地方。", "Dà bùfen yǐjīng wánchéng le, búguò hái xūyào quèrèn jǐ ge dìfang.", "Phần lớn đã xong, nhưng còn vài chỗ cần xác nhận."], ["主管", "如果有問題，我們可以一起討論。", "Rúguǒ yǒu wèntí, wǒmen kěyǐ yìqǐ tǎolùn.", "Nếu có vấn đề, chúng ta có thể cùng thảo luận."], ["你", "好的，我會先整理問題，再跟您討論。", "Hǎo de, wǒ huì xiān zhěnglǐ wèntí, zài gēn nín tǎolùn.", "Vâng, tôi sẽ tổng hợp câu hỏi trước rồi trao đổi với anh/chị."]], "q": "Người nói sẽ làm gì trước?", "options": ["Tổng hợp câu hỏi", "Gửi bản cuối", "Xin nghỉ", "Đi họp"], "answer": "Tổng hợp câu hỏi"}, {"title": "Báo đồ hỏng với chủ nhà", "level": "B1", "topic": "Sinh hoạt", "lines": [["你", "房東您好，我房間的冷氣好像壞了。", "Fángdōng nín hǎo, wǒ fángjiān de lěngqì hǎoxiàng huài le.", "Chào anh/chị, điều hòa phòng tôi hình như hỏng rồi."], ["房東", "是完全不能開，還是不冷？", "Shì wánquán bù néng kāi, háishì bù lěng?", "Không bật được hoàn toàn hay không mát?"], ["你", "可以開，但是吹出來的風不冷。", "Kěyǐ kāi, dànshì chuī chūlái de fēng bù lěng.", "Bật được, nhưng gió thổi ra không mát."], ["房東", "我明天下午請人過去修理。", "Wǒ míngtiān xiàwǔ qǐng rén guòqù xiūlǐ.", "Chiều mai tôi sẽ nhờ người đến sửa."]], "q": "Điều hòa gặp vấn đề gì?", "options": ["Bật được nhưng không mát", "Không bật được", "Rò nước", "Quá ồn"], "answer": "Bật được nhưng không mát"}, {"title": "Một kế hoạch cuối tuần", "level": "B1", "topic": "Kế hoạch", "lines": [["朋友", "你週末有什麼打算？", "Nǐ zhōumò yǒu shénme dǎsuàn?", "Cuối tuần bạn có dự định gì?"], ["你", "如果天氣好，我想去爬山。", "Rúguǒ tiānqì hǎo, wǒ xiǎng qù pá shān.", "Nếu thời tiết đẹp, tôi muốn đi leo núi."], ["朋友", "雖然有點遠，但是那裡的風景很好。", "Suīrán yǒudiǎn yuǎn, dànshì nàlǐ de fēngjǐng hěn hǎo.", "Dù hơi xa nhưng cảnh ở đó rất đẹp."], ["你", "那我們先查交通，再決定幾點出發。", "Nà wǒmen xiān chá jiāotōng, zài juédìng jǐ diǎn chūfā.", "Vậy mình tra cách đi trước rồi quyết định mấy giờ xuất phát."]], "q": "Kế hoạch leo núi phụ thuộc vào gì?", "options": ["Thời tiết", "Giá vé", "Công việc", "Đặt phòng"], "answer": "Thời tiết"}], "speaking": [["A2", "Giới thiệu một ngày của bạn", "Kể 4–5 câu về giờ đi làm, bữa trưa và buổi tối.", ["每天", "先…再…", "下班以後"], "我每天八點上班。下班以後，我先吃飯，再學中文。", "Wǒ měitiān bā diǎn shàngbān. Xiàbān yǐhòu, wǒ xiān chī fàn, zài xué Zhōngwén."], ["A2", "Gọi món theo ý mình", "Gọi một đồ uống, nêu kích cỡ, lượng đường, đá và mang đi hay tại quán.", ["我要…", "少冰", "外帶"], "我要一杯大杯紅茶，無糖、少冰，外帶，謝謝。", "Wǒ yào yì bēi dà bēi hóngchá, wú táng, shǎo bīng, wài dài, xièxie."], ["A2", "Hỏi đường khi bị lạc", "Hỏi ga MRT ở đâu, có xa không và mất bao lâu để đi bộ.", ["不好意思", "怎麼走", "多久"], "不好意思，請問捷運站怎麼走？走路大概要多久？", "Bù hǎo yìsi, qǐngwèn jiéyùn zhàn zěnme zǒu? Zǒulù dàgài yào duō jiǔ?"], ["A2", "Xin nói chậm lại", "Nói bạn đang học tiếng Trung, xin đối phương nói chậm và giải thích một từ.", ["正在", "慢一點", "意思"], "我正在學中文。可以請你說慢一點嗎？這個詞是什麼意思？", "Wǒ zhèngzài xué Zhōngwén. Kěyǐ qǐng nǐ shuō màn yì diǎn ma? Zhège cí shì shénme yìsi?"], ["B1", "Một trải nghiệm đáng nhớ", "Kể bạn đã đi đâu, làm gì, cảm nhận ra sao và có muốn quay lại không.", ["去過", "雖然…但是…", "覺得"], "我去過台南。雖然天氣很熱，但是食物很好吃。我覺得那次旅行很有意思。", "Wǒ qù guò Táinán. Suīrán tiānqì hěn rè, dànshì shíwù hěn hǎo chī. Wǒ juéde nà cì lǚxíng hěn yǒu yìsi."], ["B1", "Giải thích một vấn đề ở chỗ làm", "Nêu tiến độ, khó khăn và đề xuất cách giải quyết trong 45–60 giây.", ["已經", "不過", "建議"], "我已經完成大部分的工作，不過有些資料還需要確認。我建議明天一起討論。", "Wǒ yǐjīng wánchéng dà bùfen de gōngzuò, búguò yǒuxiē zīliào hái xūyào quèrèn. Wǒ jiànyì míngtiān yìqǐ tǎolùn."], ["B1", "So sánh hai nơi ở", "So sánh giá thuê, giao thông và môi trường; giải thích bạn chọn nơi nào.", ["比", "比較", "因為…所以…"], "這間房間比那間便宜，而且離捷運站比較近，所以我想租這間。", "Zhè jiān fángjiān bǐ nà jiān piányí, érqiě lí jiéyùn zhàn bǐjiào jìn, suǒyǐ wǒ xiǎng zū zhè jiān."], ["B1", "Kế hoạch học tiếng Trung", "Nêu mục tiêu, khó khăn hiện tại và ba việc bạn sẽ làm để tiến bộ.", ["目標", "如果…就…", "持續"], "我的目標是說中文更自然。如果每天有時間，我就練習十分鐘。我會持續學習。", "Wǒ de mùbiāo shì shuō Zhōngwén gèng zìrán. Rúguǒ měitiān yǒu shíjiān, wǒ jiù liànxí shí fēnzhōng. Wǒ huì chíxù xuéxí."]], "orders": [["A2", "Tôi đi MRT đi làm mỗi ngày.", ["我", "每天", "搭捷運", "上班"]], ["A2", "Xin bạn nói chậm hơn một chút.", ["請你", "說", "慢一點"]], ["A2", "Tôi muốn một ly cà phê mang đi.", ["我", "想要", "一杯咖啡", "外帶"]], ["A2", "Tôi chưa từng đến Đài Nam.", ["我", "沒", "去過", "台南"]], ["A2", "Hôm nay lạnh hơn hôm qua.", ["今天", "比昨天", "冷"]], ["A2", "Tôi ăn trước rồi đi học.", ["我", "先吃飯", "再", "去上課"]], ["B1", "Nếu mai rảnh thì tôi sẽ đi.", ["如果", "明天有空", "我就", "去"]], ["B1", "Dù rất mệt nhưng tôi vẫn muốn luyện tập.", ["雖然", "很累", "但是", "我還想練習"]], ["B1", "Hãy gửi tài liệu cho tôi.", ["請", "把資料", "寄給", "我"]], ["B1", "Tiếng Trung của tôi ngày càng lưu loát.", ["我的中文", "越來越", "流利"]], ["B1", "Quán này không những rẻ mà còn ngon.", ["這家店", "不但便宜", "而且", "好吃"]], ["B1", "Ngoài tiếng Trung tôi còn muốn học tiếng Nhật.", ["除了中文以外", "我", "還想", "學日文"]]]};

const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE');
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{toast('Không lưu được tiến độ. Hãy kiểm tra dung lượng hoặc chế độ riêng tư của trình duyệt.');}}
let toastTimeout;function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>$('#toast').style.display='none',4200);}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const allowed=x=>state.level==='all'||x.level===state.level;
const words=()=>DATA.vocab.filter(allowed);
const due=()=>words().filter(w=>state.words[w.id]&&state.words[w.id].due<=Date.now());
const learned=()=>words().filter(w=>state.words[w.id]);
const mastered=()=>learned().filter(w=>state.words[w.id].interval>=14&&state.words[w.id].reps>=3);
const badge=(l)=>`<span class="tag ${l==='B1'?'b1':''}">${esc(l)}</span>`;
const py=(s)=>`<div class="pinyin">${esc(s)}</div>`;
const audioButton=(text)=>`<button class="audio" data-action="audio" data-text="${esc(text)}" aria-label="Nghe ${esc(text)}">♪</button>`;
function dayLog(){const d=today();state.days[d]??={answers:0,correct:0};return state.days[d];}
function streak(){let d=new Date(),n=0;const key=x=>x.toLocaleDateString('sv-SE');if(!state.days[key(d)])d.setDate(d.getDate()-1);while(state.days[key(d)]){n++;d.setDate(d.getDate()-1);}return n;}
function activity(){dayLog();save();}
function updateWord(id,grade){const prev=state.words[id]||{interval:0,reps:0,lapses:0,due:0};let interval=grade===0?0:grade===1?1:prev.interval===0?1:Math.min(60,Math.max(3,Math.round(prev.interval*2.3)));state.words[id]={interval,reps:grade===0?0:prev.reps+1,lapses:prev.lapses+(grade===0?1:0),due:Date.now()+(grade===0?10*60000:interval*86400000)};save();}
function say(text,slow=false){if(!('speechSynthesis'in window)){toast('Trình duyệt này chưa hỗ trợ đọc. Bạn vẫn có thể học qua chữ và pinyin.');return;}const voices=speechSynthesis.getVoices();const voice=voices.find(v=>/zh[-_]TW/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang));if(!voice){toast('Chưa có giọng tiếng Trung trên thiết bị. Hãy cài giọng Mandarin trong cài đặt giọng nói của máy.');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=voice.lang;u.voice=voice;u.rate=slow?.65:.85;u.onerror=()=>toast('Không phát được giọng đọc. Hãy thử lại hoặc kiểm tra giọng nói trên thiết bị.');speechSynthesis.speak(u);}
if('speechSynthesis'in window)speechSynthesis.getVoices();
function navigate(r){if(!titles[r])r='home';if(timer){clearInterval(timer);timer=null;timerRunning=false;}if('speechSynthesis'in window)speechSynthesis.cancel();session=null;route=r;location.hash=r;render();window.scrollTo({top:0,behavior:'instant'});}
function render(){document.body.classList.toggle('no-pinyin',!state.pinyin);$('#pinyin-toggle').checked=state.pinyin;$('#global-level').value=state.level;document.querySelectorAll('[data-nav]').forEach(b=>{b.classList.toggle('active',b.dataset.nav===route);if(b.dataset.nav===route)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});$('#crumb').textContent=titles[route];main.innerHTML=({home:homeView,vocab:vocabView,practice:practiceView,grammar:grammarView,dialogues:dialoguesView,speaking:speakingView,settings:settingsView}[route])();}
const intro=(eyebrow,title,desc)=>`<div class="intro"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div></div>`;
function homeView(){const day=state.days[today()]||{answers:0,correct:0};const w=words()[Math.floor(Date.now()/86400000)%words().length];return `<div class="intro"><div><div class="eyebrow">CHÀO BẠN · 你好</div><h1>Mỗi ngày, gần tiếng Trung hơn.</h1><p>Từ những điều nhỏ hôm nay, đến những cuộc trò chuyện tự tin hơn.</p></div><span class="date-chip">${new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'long'})}</span></div>
<section class="hero"><div class="hero-copy"><div class="eyebrow">LỘ TRÌNH A2 – B1 · TIẾNG TRUNG ĐÀI LOAN</div><h2>Học một chút.<br>Dùng được nhiều hơn.</h2><p>Ôn từ, nghe một câu, nói thành lời.<br>Buổi học 10 phút của bạn bắt đầu từ đây.</p><button class="btn light" data-action="start" data-mode="daily">Bắt đầu buổi học hôm nay <span>✦</span></button></div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="art-char">語<small>yǔ<br>ngôn ngữ</small></div><div class="art-stamp">每天進步一點</div></div></section>
<div class="stats"><div class="stat"><div class="stat-top">Mục tiêu hôm nay <span class="stat-icon">◴</span></div><strong>${Math.min(day.answers,20)}<small>/ 20 câu</small></strong><progress max="20" value="${Math.min(day.answers,20)}" aria-label="Mục tiêu hôm nay"></progress></div><div class="stat"><div class="stat-top">Chuỗi ngày học <span class="stat-icon">✧</span></div><strong>${streak()}<small>ngày liên tiếp</small></strong></div><div class="stat"><div class="stat-top">Đã bắt đầu học <span class="stat-icon">▤</span></div><strong>${learned().length}<small>/ ${words().length} từ</small></strong></div><div class="stat"><div class="stat-top">Đến lúc ôn lại <span class="stat-icon">⟳</span></div><strong>${due().length}<small>từ đang chờ bạn</small></strong></div></div>
<div class="columns"><section><div class="section-head"><h2>Một chút mỗi ngày</h2><span class="note">Dành cho bạn</span></div><div class="card"><div class="lesson-row"><div class="lesson-icon">詞</div><div><h3>Ôn từ, nhớ lâu hơn</h3><p>Flashcard · Lịch ôn theo mức độ nhớ</p></div><button class="btn small soft" data-action="start" data-mode="flash">Học từ</button></div><div class="lesson-row"><div class="lesson-icon">聽</div><div><h3>Nghe những câu quen thuộc</h3><p>Hội thoại · Tình huống tại Đài Loan</p></div><button class="btn small secondary" data-nav="dialogues">Luyện nghe</button></div><div class="lesson-row"><div class="lesson-icon">說</div><div><h3>Biến ý nghĩ thành lời nói</h3><p>Chủ đề ngắn · Nói trong 60 giây</p></div><button class="btn small secondary" data-nav="speaking">Luyện nói</button></div></div></section><section><div class="section-head"><h2>Từ của hôm nay</h2><button class="text-btn" data-nav="vocab">Khám phá từ vựng</button></div><div class="card word-day"><div class="card-meta">${badge(w.level)}<span class="note">${esc(w.topic)}</span></div><div class="han" lang="zh-Hant">${esc(w.han)}</div>${py(w.pinyin)}<p class="meaning">${esc(w.vi)}</p><div class="example" lang="zh-Hant">${esc(w.example)}</div>${audioButton(w.han)}</div></section></div>
<section class="space-top"><div class="section-head"><h2>Tiếng Trung quanh bạn</h2><span class="note">8 chủ đề thực tế</span></div><div class="topic-grid">${Object.entries({'Ăn uống':'食','Đi lại':'行','Công việc':'工','Mua sắm':'買','Sinh hoạt':'家','Sức khỏe':'康','Giao tiếp':'聊','Kế hoạch':'想'}).map(([t,c])=>`<button class="topic" data-action="topic" data-topic="${t}"><span class="topic-char" lang="zh-Hant">${c}</span><strong>${t}</strong><small>${words().filter(w=>w.topic===t).length} từ · ${learned().filter(w=>w.topic===t).length} đã học</small></button>`).join('')}</div></section>`;}
function visibleWords(){return words().filter(w=>(topic==='all'||w.topic===topic)&&(wordFilter!=='star'||state.stars.includes(w.id))&&(wordFilter!=='due'||state.words[w.id]?.due<=Date.now())&&(wordFilter!=='new'||!state.words[w.id])&&normalize([w.han,w.pinyin,w.vi].join(' ')).includes(normalize(search)));}
function vocabCards(){const ws=visibleWords();return ws.length?ws.map(w=>`<article class="card vocab-card"><div class="card-meta">${badge(w.level)}<span class="note">${esc(w.topic)}</span>${audioButton(w.han)}</div><div class="han" lang="zh-Hant">${esc(w.han)}</div>${py(w.pinyin)}<p>${esc(w.vi)}</p><p class="example" lang="zh-Hant">${esc(w.example)}</p><div class="meta-bottom"><span>${state.words[w.id]?(state.words[w.id].due<=Date.now()?'Đến lịch ôn':`Ôn lại ${new Date(state.words[w.id].due).toLocaleDateString('vi-VN')}`):'Từ mới'}</span><button class="star" data-action="star" data-id="${w.id}" aria-label="${state.stars.includes(w.id)?'Bỏ lưu':'Lưu'} ${w.han}" aria-pressed="${state.stars.includes(w.id)}">${state.stars.includes(w.id)?'★':'☆'}</button></div></article>`).join(''):'<div class="card empty">Không có từ phù hợp. Thử đổi chủ đề hoặc bộ lọc nhé.</div>';}
function vocabView(){return intro('TÍCH LŨY MỖI NGÀY','Những từ bạn sẽ dùng thật.','Chữ phồn thể, pinyin và ví dụ trong sinh hoạt ở Đài Loan.')+`<div class="toolbar"><input class="search" id="search" aria-label="Tìm từ" placeholder="Tìm chữ Hán, pinyin hoặc nghĩa tiếng Việt…" value="${esc(search)}"><select id="topic-select" aria-label="Chủ đề"><option value="all">Tất cả chủ đề</option>${[...new Set(DATA.vocab.map(w=>w.topic))].map(t=>`<option ${t===topic?'selected':''}>${t}</option>`).join('')}</select><button class="btn" data-action="start" data-mode="vocab-flash">Học bộ từ này</button></div><div class="section-head"><div class="filters">${[['all','Tất cả'],['new','Chưa học'],['due','Cần ôn'],['star','Đã lưu']].map(([v,t])=>`<button class="filter ${wordFilter===v?'active':''}" data-action="filter" data-value="${v}">${t}</button>`).join('')}</div><span class="note" id="word-count">${visibleWords().length} từ</span></div><div class="vocab-grid" id="vocab-list">${vocabCards()}</div><p class="note space-top">Nhãn A2/B1 là mức học gợi ý cho nội dung này, không phải phân loại TOCFL chính thức của từng từ.</p>`;}
function practiceView(){if(session)return quizView();return intro('NHỚ BẰNG CÁCH SỬ DỤNG','Một lần luyện, một chút tiến bộ.','Chọn cách luyện. Mỗi lượt có tối đa 10 câu, có đáp án và giải thích.')+`<div class="practice-layout"><div class="mode-grid">${[['meaning','詞','Chọn nghĩa đúng','Nhìn chữ Hán, nhớ nghĩa tiếng Việt.'],['listening','聽','Nghe và nhận biết','Nghe từ rồi chọn nghĩa, chưa hiện chữ Hán.'],['typing','寫','Gõ lại từ vựng','Từ nghĩa tiếng Việt, gõ chữ Hán hoặc pinyin.'],['order','句','Xếp câu tự nhiên','Sắp xếp các cụm từ thành câu đúng.'],['grammar','文','Điền mẫu ngữ pháp','Chọn từ nối và cấu trúc phù hợp.'],['flash','記','Flashcard chủ động','Tự nhớ trước khi mở mặt sau.']].map(([m,c,t,d])=>`<button class="mode-card" data-action="start" data-mode="${m}"><span class="mode-glyph">${c}</span><h3>${t}</h3><p>${d}</p><span class="tag">${m==='grammar'?'12 mẫu':m==='order'?'12 câu':'120 từ'} · Lọc theo trình độ</span></button>`).join('')}</div><aside><div class="card review-panel"><h3>Gặp lại đúng lúc</h3><strong>${due().length}</strong><p>từ đến lịch ôn. Từ chưa nhớ sẽ quay lại sau 10 phút.</p><button class="btn light space-top" data-action="start" data-mode="review">Ôn từ đến hạn</button></div><div class="card space-top"><h3>Nhớ lâu hơn</h3><p class="note">Tự nhớ đáp án trước khi xem. Đọc ví dụ thành tiếng. Sau đó tự đặt một câu về cuộc sống của bạn.</p><p class="note">Giọng đọc dùng tính năng trên thiết bị; cần có giọng Mandarin. Tiến độ lưu trong trình duyệt này.</p></div></aside></div>`;}
function normalize(s){return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/đ/g,'d').replace(/[\s，。！？、,.!?;：:「」“”]/g,'');}
function wordQuestion(w,mode){const type=mode==='daily'?shuffle(['meaning','typing','meaning'])[0]:mode;return {type,w,answer:w.vi,options:shuffle([w.vi,...shuffle(DATA.vocab.filter(x=>x.vi!==w.vi)).slice(0,3).map(x=>x.vi)])};}
function start(mode){let pool=words(),kind=mode;if(mode==='review')pool=due();if(mode==='vocab-flash'){pool=visibleWords();kind='flash';}if(mode==='flash'||mode==='daily'){const reviews=shuffle(due());const fresh=shuffle(words().filter(w=>!state.words[w.id]));const other=shuffle(words().filter(w=>state.words[w.id]&&!reviews.some(x=>x.id===w.id)));pool=[...reviews,...fresh,...other];}else pool=shuffle(pool);let qs;if(mode==='grammar')qs=shuffle(DATA.grammar.filter(allowed)).slice(0,10).map(g=>({type:'grammar',g,answer:g.answer,options:shuffle(g.options)}));else if(mode==='order')qs=shuffle(DATA.orders.filter(x=>state.level==='all'||x[0]===state.level)).slice(0,10).map(o=>({type:'order',order:o,tokens:shuffle(o[2].map((t,i)=>({t,i}))),picked:[]}));else qs=pool.slice(0,10).map(w=>wordQuestion(w,kind==='review'?'flash':kind));if(!qs.length){toast(mode==='review'?'Chưa có từ đến lịch ôn. Bạn có thể học từ mới bằng Flashcard.':'Không có nội dung phù hợp với bộ lọc.');return;}session={mode,qs,index:0,correct:0,answered:false,revealed:false,mistakes:[]};route='practice';location.hash='practice';render();window.scrollTo({top:0,behavior:'instant'});}
function quizView(){const s=session;if(s.index>=s.qs.length)return resultView();const q=s.qs[s.index];let body='';if(['meaning','typing','listening','flash'].includes(q.type)){const w=q.w;body=`<div class="card-meta">${badge(w.level)}<span class="note">${esc(w.topic)}</span></div>`;if(q.type==='listening')body+=`<div class="flash-front"><p>Nghe từ và chọn nghĩa phù hợp.</p><button class="btn" data-action="listen">♪ Nghe từ</button> <button class="btn secondary" data-action="listen-slow">Nghe chậm</button><p class="note space-top">Cần giọng Mandarin trên thiết bị. Có thể chọn chế độ khác nếu chưa có giọng đọc.</p></div>`;else if(q.type==='typing')body+=`<div class="flash-front"><p>Viết từ tiếng Trung có nghĩa:</p><h2>${esc(w.vi)}</h2><p class="note">Gõ chữ Hán hoặc pinyin có/không dấu. Bài này không chấm thanh điệu.</p></div><input class="typing" id="typed-answer" aria-label="Câu trả lời" autocomplete="off" placeholder="Nhập từ tại đây…">`;else body+=`<div class="quiz-han" lang="zh-Hant">${esc(w.han)}</div>${py(w.pinyin)}<div style="text-align:center">${audioButton(w.han)}</div>`;if(q.type==='flash'){body+=s.revealed?`<div class="flash-front"><div class="meaning">${esc(w.vi)}</div><p lang="zh-Hant">${esc(w.example)}</p>${audioButton(w.example)}</div><p class="note">Chọn theo mức độ bạn đã nhớ trước khi mở đáp án.</p><div class="flash-actions"><button class="btn secondary" data-action="grade" data-grade="0">Chưa nhớ · 10 phút</button><button class="btn secondary" data-action="grade" data-grade="1">Hơi khó · 1 ngày</button><button class="btn" data-action="grade" data-grade="2">Đã nhớ</button></div>`:`<div class="flash-front"><p class="note">Tự nói nghĩa trước khi mở mặt sau.</p><button class="btn" data-action="reveal">Hiện đáp án</button></div>`;}else if(q.type!=='typing')body+=answers(q.options);}else if(q.type==='grammar'){body=`${badge(q.g.level)}<p class="quiz-prompt space-top">Chọn từ thích hợp để hoàn thành câu.</p><div class="quiz-han" lang="zh-Hant">${esc(q.g.q)}</div>${answers(q.options)}`;}else if(q.type==='order'){body=`${badge(q.order[0])}<p class="quiz-prompt space-top">Sắp xếp câu: ${esc(q.order[1])}</p><div class="token-answer" aria-label="Câu đã xếp">${q.picked.length?q.picked.map(i=>`<button class="token" data-action="unpick" data-index="${i}" ${s.answered?'disabled':''}>${esc(q.order[2][i])}</button>`).join(''):'<span class="note">Chọn các cụm từ ở bên dưới…</span>'}</div><div class="token-bank">${q.tokens.filter(x=>!q.picked.includes(x.i)).map(x=>`<button class="token" data-action="pick" data-index="${x.i}" ${s.answered?'disabled':''}>${esc(x.t)}</button>`).join('')}</div>`;}
return `<div class="quiz"><div class="quiz-top"><button class="text-btn" data-action="quit">Đóng buổi luyện</button><span class="note">Câu ${s.index+1} / ${s.qs.length}</span></div><div class="progress-track"><div class="progress-fill" style="width:${100*s.index/s.qs.length}%"></div></div><div class="card">${body}<div id="feedback" aria-live="polite"></div>${q.type==='flash'?'':`<div class="quiz-actions"><span class="note">${s.correct} câu đúng</span>${['typing','order'].includes(q.type)?'<button class="btn" id="check-btn" data-action="check">Kiểm tra</button>':''}<button class="btn hidden" id="next-btn" data-action="next">Câu tiếp theo</button></div>`}</div></div>`;}
function answers(opts){return `<div class="answers">${opts.map((a,i)=>`<button class="answer" data-action="answer" data-index="${i}">${esc(a)}</button>`).join('')}</div>`;}
function recordAnswer(correct,q,trackWord=true){dayLog().answers++;if(correct){dayLog().correct++;session.correct++;}else session.mistakes.push(q);if(q.w&&trackWord)updateWord(q.w.id,correct?2:0);save();}
function check(selected){const s=session;if(!s||s.answered)return;const q=s.qs[s.index];let correct=false,expected='';if(q.type==='order'){if(q.picked.length!==q.order[2].length){toast('Hãy chọn đủ các cụm từ trước khi kiểm tra.');return;}correct=q.picked.every((x,i)=>x===i);expected=q.order[2].join('');}else if(q.type==='typing'){const v=$('#typed-answer').value.trim();if(!v){toast('Hãy nhập câu trả lời trước nhé.');return;}correct=[q.w.han,q.w.pinyin].some(x=>normalize(x)===normalize(v));expected=q.w.han+' · '+q.w.pinyin+' · '+q.w.vi;$('#typed-answer').disabled=true;}else{correct=selected===q.answer;expected=q.type==='grammar'?q.g.answer:q.w.han+' · '+q.w.pinyin+' · '+q.w.vi;document.querySelectorAll('.answers .answer').forEach(b=>{b.disabled=true;if(q.options[Number(b.dataset.index)]===q.answer)b.classList.add('correct');else if(q.options[Number(b.dataset.index)]===selected)b.classList.add('wrong');});}s.answered=true;recordAnswer(correct,q);const explanation=q.type==='grammar'?q.g.why:q.w?q.w.example:'Đặt chủ ngữ và các thành phần theo đúng trật tự của câu mẫu.';$('#feedback').innerHTML=`<div class="feedback ${correct?'':'bad'}"><strong>${correct?'Bạn nhớ đúng rồi!':'Chưa đúng. Mình cùng nhớ lại nhé.'}</strong><div lang="zh-Hant">${esc(expected)}</div><p style="margin:8px 0 0">${esc(explanation)}</p>${q.w?audioButton(q.w.example):''}</div>`;if($('#check-btn'))$('#check-btn').classList.add('hidden');$('#next-btn').classList.remove('hidden');$('#next-btn').focus();}
function next(){if(!session?.answered)return;session.index++;session.answered=false;session.revealed=false;main.innerHTML=quizView();}
function resultView(){const s=session;return `<div class="quiz result"><div class="card"><div class="eyebrow">MỘT BƯỚC TIẾN HÔM NAY</div><h1>Bạn đã hoàn thành!</h1><div class="big-score">${s.correct}<span style="font-size:30px;color:var(--muted)"> / ${s.qs.length}</span></div><p>${s.mode==='flash'||s.mode==='review'||s.mode==='vocab-flash'?'Số từ bạn tự đánh giá đã nhớ.':'Số câu trả lời đúng.'} Tiến độ đã được lưu trên thiết bị này.</p>${s.mistakes.length?`<p class="note">${s.mistakes.length} câu cần luyện thêm. Các từ chưa nhớ sẽ đến lịch ôn sau 10 phút.</p><button class="btn" data-action="retry">Luyện lại câu chưa nhớ</button>`:'<p>Bạn đang làm rất tốt. Thử đặt một câu của riêng mình nhé.</p>'}<div class="button-row" style="justify-content:center;margin-top:20px"><button class="btn secondary" data-nav="home">Về hôm nay</button><button class="btn secondary" data-nav="practice">Chọn bài luyện khác</button></div></div></div>`;}
function grammarView(){return intro('HIỂU MẪU · DÙNG ĐƯỢC CÂU','Ngữ pháp vừa đủ để nói.','12 cấu trúc từ A2 đến B1. Đọc mẫu, nghe ví dụ, rồi luyện điền từ.')+`<div class="toolbar"><button class="btn" data-action="start" data-mode="grammar">Luyện ngữ pháp</button><span class="note">${DATA.grammar.filter(allowed).length} cấu trúc phù hợp</span></div><div class="grammar-grid">${DATA.grammar.filter(allowed).map(g=>`<article class="card grammar-card"><div class="card-meta">${badge(g.level)}${audioButton(g.example)}</div><h3 lang="zh-Hant">${esc(g.title)}</h3><p>${esc(g.note)}</p><div class="example-box"><div lang="zh-Hant">${esc(g.example)}</div>${py(g.pinyin)}<p>${esc(g.vi)}</p></div></article>`).join('')}</div>`;}
function dialoguesView(){const list=DATA.dialogues.filter(allowed);if(!list.some(d=>DATA.dialogues.indexOf(d)===dialogueIndex))dialogueIndex=DATA.dialogues.indexOf(list[0]);const d=DATA.dialogues[dialogueIndex];return intro('NGHE HIỂU TRONG NGỮ CẢNH','Những cuộc trò chuyện đời thường.','Nghe từng câu. Ẩn bản dịch để thử nghe trước, rồi trả lời câu hỏi.')+`<div class="dialogue-tabs">${list.map(x=>`<button class="filter ${x===d?'active':''}" data-action="dialogue" data-index="${DATA.dialogues.indexOf(x)}">${esc(x.title)}</button>`).join('')}</div><div class="dialogue-layout"><div class="card"><div class="card-meta">${badge(d.level)}<button class="btn small secondary" data-action="translation">Ẩn / hiện bản dịch</button></div><h2 class="space-top">${esc(d.title)}</h2>${d.lines.map(([sp,h,p,v])=>`<div class="dialogue-line"><span class="speaker" lang="zh-Hant">${sp}</span><div class="speech"><div lang="zh-Hant" class="han">${esc(h)}</div>${py(p)}<p class="translation">${esc(v)}</p></div>${audioButton(h)}</div>`).join('')}</div><div><div class="card dialogue-question"><div class="eyebrow">KIỂM TRA NGHE HIỂU</div><h3>${esc(d.q)}</h3>${shuffle(d.options).map(a=>`<button class="answer" data-action="dialogue-answer" data-value="${esc(a)}">${esc(a)}</button>`).join('')}<div id="dialogue-feedback" aria-live="polite"></div></div><div class="card space-top"><h3>Thử đổi vai</h3><p class="note">Đọc vai “你”, sau đó thay một chi tiết: loại đồ uống, điểm đến hoặc thời gian. Lặp lại mà không nhìn chữ.</p><p class="note">Đây là giọng tổng hợp của thiết bị; chất giọng tùy giọng Mandarin đã cài.</p></div></div></div>`;}
function speakingView(){const list=DATA.speaking.filter(x=>state.level==='all'||x[0]===state.level);if(!list.includes(DATA.speaking[speakingIndex]))speakingIndex=DATA.speaking.indexOf(list[0]);const s=DATA.speaking[speakingIndex];return intro('NGHĨ ÍT HƠN · NÓI NHIỀU HƠN','Cho tiếng Trung thành tiếng nói.','Chọn một chủ đề, chuẩn bị ý chính và nói trong 60 giây.')+`<div class="speaking-layout"><div>${list.map(x=>`<button class="speak-item ${x===s?'active':''}" data-action="speaking" data-index="${DATA.speaking.indexOf(x)}">${badge(x[0])}<span>${esc(x[1])}</span><span style="margin-left:auto">${state.speaking.includes(DATA.speaking.indexOf(x))?'✓':''}</span></button>`).join('')}</div><div class="card speaking-prompt">${badge(s[0])}<h2 class="space-top">${esc(s[1])}</h2><p>${esc(s[2])}</p><div class="filters">${s[3].map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div class="timer" id="timer">01:00</div><div class="speaking-controls"><button class="btn" data-action="timer" id="timer-btn">Bắt đầu nói</button><button class="btn secondary" data-action="reset-timer">Đặt lại</button></div><textarea id="speaking-note" aria-label="Ý chính của bạn" placeholder="Ghi vài ý chính. Khi nói, thử không đọc cả câu…">${esc(state.notes[speakingIndex]||'')}</textarea><details><summary>Xem một cách trả lời</summary><div class="example-box"><div lang="zh-Hant">${esc(s[4])}</div>${py(s[5])}${audioButton(s[4])}</div></details><h3 class="space-top">Tự kiểm tra sau khi nói</h3><div class="checklist"><label><input type="checkbox" class="selfcheck"> Tôi đã nói thành câu đầy đủ.</label><label><input type="checkbox" class="selfcheck"> Tôi đã dùng ít nhất một cụm gợi ý.</label><label><input type="checkbox" class="selfcheck"> Tôi đã thử nói lại tự nhiên hơn.</label></div><button class="btn soft space-top" data-action="complete-speaking">Đánh dấu đã luyện</button><p class="note space-top">Bạn tự đánh giá bài nói. Trang không thu âm hoặc chấm phát âm tự động.</p></div></div>`;}
function settingsView(){const allAnswers=Object.values(state.days).reduce((a,d)=>a+d.answers,0),correct=Object.values(state.days).reduce((a,d)=>a+d.correct,0);return intro('GÓC HỌC CỦA BẠN','Tiến độ nhỏ, thay đổi lớn.','Quản lý dữ liệu học và mang tiến độ sang thiết bị khác.')+`<div class="settings"><div class="stats"><div class="stat"><div class="stat-top">Đã làm</div><strong>${allAnswers}<small>câu</small></strong></div><div class="stat"><div class="stat-top">Trả lời đúng</div><strong>${allAnswers?Math.round(correct/allAnswers*100):0}%</strong></div><div class="stat"><div class="stat-top">Từ nhớ vững</div><strong>${mastered().length}</strong></div><div class="stat"><div class="stat-top">Ngày có học</div><strong>${Object.keys(state.days).length}</strong></div></div><div class="card"><h3>Sao lưu tiến độ</h3><p>Tiến độ lưu trong trình duyệt hiện tại. Xuất file để sao lưu hoặc nhập trên thiết bị khác. Trang không có tài khoản và không tự đồng bộ.</p><div class="button-row"><button class="btn" data-action="export">Xuất tiến độ (.json)</button><button class="btn secondary" data-action="import">Nhập tiến độ</button><input class="hidden" id="import-file" type="file" accept="application/json,.json"></div></div><div class="card"><h3>Cách tính lịch ôn</h3><p>Chưa nhớ: ôn sau 10 phút. Hơi khó: ôn sau 1 ngày. Đã nhớ: bắt đầu từ 1 ngày, rồi khoảng 3, 7, 16 ngày… tối đa 60 ngày. Trả lời sai sẽ đưa từ đó về lịch 10 phút.</p><p>“Từ nhớ vững” là từ có ít nhất 3 lần nhớ liên tiếp và khoảng ôn từ 14 ngày. Điểm Flashcard là tự đánh giá; các bài chọn nghĩa và gõ từ kiểm tra đáp án có sẵn.</p></div><div class="card"><h3>Về nội dung & giọng đọc</h3><p>120 từ, 12 mẫu ngữ pháp, 12 câu xếp từ, 6 hội thoại, 8 chủ đề nói. Nội dung ưu tiên chữ phồn thể và cách dùng tại Đài Loan, kèm tiếng Việt. Mức A2/B1 là gợi ý học, không phải danh sách TOCFL chính thức.</p><p>Giọng đọc dùng Speech Synthesis của trình duyệt, ưu tiên zh-TW. Bạn cần cài giọng Mandarin trên thiết bị; giọng có thể phụ thuộc hệ điều hành và kết nối mạng.</p></div><div class="card"><h3>Bắt đầu lại</h3><p>Xóa tiến độ học trên trình duyệt này. Hãy xuất bản sao trước nếu bạn muốn giữ lại.</p><button class="btn secondary" data-action="reset-data">Xóa tiến độ</button></div></div>`;}
function resetTimer(){clearInterval(timer);timer=null;timerRunning=false;seconds=60;if($('#timer')){$('#timer').textContent='01:00';$('#timer-btn').textContent='Bắt đầu nói';}}
function toggleTimer(){if(timerRunning){clearInterval(timer);timer=null;timerRunning=false;$('#timer-btn').textContent='Tiếp tục';return;}if(seconds<=0)seconds=60;timerRunning=true;$('#timer-btn').textContent='Tạm dừng';timer=setInterval(()=>{seconds--;const e=$('#timer');if(e)e.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds<=0){clearInterval(timer);timer=null;timerRunning=false;if($('#timer-btn'))$('#timer-btn').textContent='Nói lại';toast('Đủ 60 giây rồi! Tự kiểm tra và thử nói lại một lần nhé.');}},1000);}
function exportProgress(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='shiyu-progress-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function validateImport(s){if(!s||s.version!==1||!s.words||typeof s.words!=='object'||Array.isArray(s.words)||!s.days||typeof s.days!=='object'||Array.isArray(s.days)||!Array.isArray(s.stars)||!Array.isArray(s.speaking)||!s.notes||typeof s.notes!=='object'||Array.isArray(s.notes)||typeof s.pinyin!=='boolean'||!['A2','B1','all'].includes(s.level))throw Error();const clean=defaults();for(const [id,w]of Object.entries(s.words)){if(!DATA.vocab.some(x=>x.id===id)||!w||!['interval','reps','lapses','due'].every(k=>Number.isFinite(w[k])&&w[k]>=0)||w.interval>60||!Number.isInteger(w.reps)||!Number.isInteger(w.lapses))throw Error();clean.words[id]={interval:w.interval,reps:w.reps,lapses:w.lapses,due:w.due};}for(const [d,x]of Object.entries(s.days)){if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!x||!Number.isInteger(x.answers)||!Number.isInteger(x.correct)||x.answers<0||x.correct<0||x.correct>x.answers)throw Error();clean.days[d]={answers:x.answers,correct:x.correct};}clean.stars=[...new Set(s.stars.filter(id=>DATA.vocab.some(w=>w.id===id)))];clean.speaking=[...new Set(s.speaking.filter(i=>Number.isInteger(i)&&DATA.speaking[i]))];for(const [k,v]of Object.entries(s.notes)){if(!/^\d+$/.test(k)||!DATA.speaking[Number(k)]||typeof v!=='string'||v.length>20000)throw Error();clean.notes[k]=v;}clean.level=s.level;clean.pinyin=s.pinyin;return clean;}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return;}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;switch(a){case'audio':say(b.dataset.text);break;case'topic':topic=b.dataset.topic;wordFilter='all';search='';navigate('vocab');break;case'filter':wordFilter=b.dataset.value;render();break;case'star':state.stars=state.stars.includes(b.dataset.id)?state.stars.filter(x=>x!==b.dataset.id):[...state.stars,b.dataset.id];save();render();break;case'start':start(b.dataset.mode);break;case'quit':navigate('practice');break;case'reveal':session.revealed=true;main.innerHTML=quizView();break;case'grade':{if(!session||session.answered)return;const q=session.qs[session.index];session.answered=true;recordAnswer(Number(b.dataset.grade)>0,q,false);updateWord(q.w.id,Number(b.dataset.grade));next();break;}case'listen':case'listen-slow':say(session.qs[session.index].w.han,a==='listen-slow');break;case'answer':check(session.qs[session.index].options[Number(b.dataset.index)]);break;case'check':check();break;case'next':next();break;case'pick':case'unpick':{const q=session?.qs[session.index];if(!q||session.answered)return;const i=Number(b.dataset.index);if(a==='pick'&&!q.picked.includes(i))q.picked.push(i);if(a==='unpick')q.picked=q.picked.filter(x=>x!==i);main.innerHTML=quizView();break;}case'retry':{const qs=session.mistakes.map(q=>q.w?wordQuestion(q.w,q.type):q.type==='order'?{...q,picked:[],tokens:shuffle(q.tokens)}:{...q,options:shuffle(q.options)});session={mode:session.mode,qs,index:0,correct:0,answered:false,revealed:false,mistakes:[]};main.innerHTML=quizView();break;}case'dialogue':dialogueIndex=Number(b.dataset.index);render();break;case'translation':document.querySelectorAll('.translation').forEach(p=>p.classList.toggle('hidden'));break;case'dialogue-answer':{const d=DATA.dialogues[dialogueIndex];document.querySelectorAll('.dialogue-question .answer').forEach(el=>{el.disabled=true;if(el.dataset.value===d.answer)el.classList.add('correct');else if(el===b)el.classList.add('wrong');});const correct=b.dataset.value===d.answer;dayLog().answers++;if(correct)dayLog().correct++;save();$('#dialogue-feedback').innerHTML=`<div class="feedback ${correct?'':'bad'}">${correct?'Đúng rồi!':'Đáp án: '+esc(d.answer)}<p style="margin:8px 0 0">Đọc lại hội thoại và thử nói vai “你” nhé.</p></div>`;break;}case'speaking':resetTimer();speakingIndex=Number(b.dataset.index);render();break;case'timer':toggleTimer();break;case'reset-timer':resetTimer();break;case'complete-speaking':if(document.querySelectorAll('.selfcheck:checked').length<3){toast('Hãy tự kiểm tra cả ba mục sau khi luyện nói nhé.');return;}if(!state.speaking.includes(speakingIndex))state.speaking.push(speakingIndex);activity();resetTimer();render();toast('Đã lưu buổi luyện nói. Hẹn bạn một chủ đề mới!');break;case'export':exportProgress();break;case'import':$('#import-file').click();break;case'reset-data':if(confirm('Xóa toàn bộ tiến độ Shíyǔ trên trình duyệt này? Bạn có thể xuất file sao lưu trước.')){state=defaults();save();render();toast('Đã đặt lại tiến độ.');}break;}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;$('#vocab-list').innerHTML=vocabCards();$('#word-count').textContent=visibleWords().length+' từ';}if(e.target.id==='speaking-note'){state.notes[speakingIndex]=e.target.value.slice(0,20000);save();}});
document.addEventListener('change',async e=>{if(e.target.id==='pinyin-toggle'){state.pinyin=e.target.checked;document.body.classList.toggle('no-pinyin',!state.pinyin);save();}if(e.target.id==='global-level'){state.level=e.target.value;session=null;resetTimer();save();render();}if(e.target.id==='topic-select'){topic=e.target.value;render();}if(e.target.id==='import-file'){const f=e.target.files[0];if(!f)return;if(f.size>2000000){toast('File quá lớn. Hãy chọn file tiến độ Shíyǔ.');return;}try{const s=validateImport(JSON.parse(await f.text()));if(confirm('Thay tiến độ hiện tại bằng file đã chọn? Hãy xuất bản sao trước nếu cần.')){state=s;save();render();toast('Đã nhập tiến độ.');}}catch{toast('File tiến độ không hợp lệ. Dữ liệu hiện tại được giữ nguyên.');}e.target.value='';}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='typed-answer'){e.preventDefault();check();}});
window.addEventListener('hashchange',()=>{const r=location.hash.slice(1);if(titles[r]&&r!==route){navigate(r);}});
route=titles[location.hash.slice(1)]?location.hash.slice(1):'home';render();
</script></body></html>
